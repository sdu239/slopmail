let offeneBlaetter = [];

function zeigeBlatt({ titel, inhalt, aktionen, beimSchliessen }) {
  const vorherFokus = document.activeElement;
  const schleier = h('div', { class: 'schleier' });
  const schliessenKnopf = h('button', { type: 'button', class: 'symbol-knopf', 'aria-label': 'Schließen' }, symbol('schliessen', 20));
  const blatt = h('div', { class: 'blatt', role: 'dialog', 'aria-modal': 'true', 'aria-label': titel || 'Dialog', tabindex: '-1' },
    h('div', { class: 'blatt-kopf' }, h('h2', {}, titel || ''), schliessenKnopf),
    inhalt,
    aktionen && aktionen.length ? h('div', { class: 'zeile umbruch', style: { justifyContent: 'flex-end', marginTop: '18px' } }, aktionen) : null);
  let offen = true;
  const schliessen = () => {
    if (!offen) return;
    offen = false;
    schleier.remove();
    blatt.remove();
    offeneBlaetter = offeneBlaetter.filter((b) => b !== eintrag);
    document.removeEventListener('keydown', taste);
    if (vorherFokus && vorherFokus.focus) { try { vorherFokus.focus({ preventScroll: true }); } catch (e) { /* egal */ } }
    if (beimSchliessen) beimSchliessen();
  };
  const taste = (ev) => { if (ev.key === 'Escape' && offeneBlaetter[offeneBlaetter.length - 1] === eintrag) schliessen(); };
  const eintrag = { schliessen };
  schleier.addEventListener('click', schliessen);
  schliessenKnopf.addEventListener('click', schliessen);
  document.addEventListener('keydown', taste);
  document.body.appendChild(schleier);
  document.body.appendChild(blatt);
  offeneBlaetter.push(eintrag);
  requestAnimationFrame(() => { try { blatt.focus({ preventScroll: true }); } catch (e) { /* egal */ } });
  return schliessen;
}

function schliesseAlleBlaetter() {
  for (const b of offeneBlaetter.slice()) b.schliessen();
}

/** Bestätigung im eigenen Dialog. Liefert ein Promise mit true/false. */
function bestaetigen({ titel, text, ja = 'Ja', nein = 'Abbrechen', gefahr = false }) {
  return new Promise((fertig) => {
    let ergebnis = false;
    const jaKnopf = h('button', { type: 'button', class: 'knopf ' + (gefahr ? 'gefahr' : 'gold') }, ja);
    const neinKnopf = h('button', { type: 'button', class: 'knopf leise' }, nein);
    const schliessen = zeigeBlatt({
      titel,
      inhalt: h('p', { class: 'text-2' }, text),
      aktionen: [neinKnopf, jaKnopf],
      beimSchliessen: () => fertig(ergebnis)
    });
    jaKnopf.addEventListener('click', () => { ergebnis = true; schliessen(); });
    neinKnopf.addEventListener('click', () => schliessen());
    requestAnimationFrame(() => jaKnopf.focus());
  });
}

  const el = h('div', { class: 'meldung ' + art, role: art === 'fehler' ? 'alert' : 'status' },

    h('div', { class: 'wachsen' }, text),
    optionen.aktion ? h('button', { type: 'button', class: 'knopf klein', onclick: () => { entfernen(); optionen.aktion.fn(); } }, optionen.aktion.text) : null,
    h('button', { type: 'button', class: 'symbol-knopf', 'aria-label': 'Meldung schließen', style: { width: '32px', height: '32px' }, onclick: () => entfernen() }, symbol('schliessen', 16)));
  const entfernen = () => el.remove();
  box.appendChild(el);

}

  eintragen: null,
  laedt: false,
  partienFilter: { suche: '', spiel: '', spieler: '', geloeschte: false, anzahl: 12 }
};

const ZEITRAEUME = [
  { art: 'gesamt', text: 'Gesamt' },
  { art: 'jahr', text: 'Dieses Jahr' },
  { art: 'vorjahr', text: 'Letztes Jahr' },
  { art: 'quartal', text: 'Dieses Quartal' },
  { art: 'vorquartal', text: 'Letztes Quartal' },
  { art: '3monate', text: 'Letzte 3 Monate' },
  { art: 'eigen', text: 'Eigener Zeitraum' }
];

function zeitraumGrenzen(art) {
  const heute = heuteTag();
  const j = jahrVon(heute);
  const q = quartalVon(heute);
  switch (art) {
    case 'jahr': return { von: jahrStart(j), bis: null };
    case 'vorjahr': return { von: jahrStart(j - 1), bis: jahrEnde(j - 1) };
    case 'quartal': return { von: quartalStart(q.jahr, q.q), bis: null };
    case 'vorquartal': {
      const v = quartalAusSchluessel(q.jahr * 4 + q.q - 2);
      return { von: quartalStart(v.jahr, v.q), bis: quartalEnde(v.jahr, v.q) };
    }
    case '3monate': {
      const t = teileAusTag(heute);
      return { von: Math.round(Date.UTC(t.jahr, t.monat - 4, t.tag) / MS_TAG), bis: null };
    }
    case 'eigen': return zustand.eigenerZeitraum || { von: null, bis: null };
    default: return { von: null, bis: null };
  }
}

function aktuellerZeitraum() {
  const g = zeitraumGrenzen(zustand.zeitraumArt);
  let bis = g.bis;
  if (zustand.zeitreise !== null) bis = bis === null ? zustand.zeitreise : Math.min(bis, zustand.zeitreise);
  return { von: g.von, bis };
}

function aktuelleAuswertung() {
  return auswerten(zustand.modell, aktuellerZeitraum());
}

function zeitraumText() {
  const eintrag = ZEITRAEUME.find((z) => z.art === zustand.zeitraumArt) || ZEITRAEUME[0];
  if (zustand.zeitraumArt === 'eigen') {
    const g = zeitraumGrenzen('eigen');
    return (g.von !== null ? fmtDatum(g.von) : 'Anfang') + ' – ' + (g.bis !== null ? fmtDatum(g.bis) : 'heute');
  }
  return eintrag.text;
}

// ---------------------------------------------------------------------------
// Navigation über den Adress-Anker (#gesamt, #spiel~brass-birmingham, …)
// ---------------------------------------------------------------------------

function leseAnker() {
  let roh = '';
  try { roh = decodeURIComponent((window.location.hash || '').slice(1)); } catch (e) { roh = ''; }
  const [teil, parameter] = roh.split('~');
  const bekannt = ['gesamt', 'spiele', 'spiel', 'eintragen', 'spieler', 'vergleich', 'partien'];
  let ansicht = bekannt.includes(teil) ? teil : 'gesamt';
  if (ansicht === 'spieler' && parameter) ansicht = 'profil';
  return { ansicht, parameter: parameter || null };
}

function geheZu(anker) {
  try {
    if (window.location.hash === anker) zeigeAnsicht();
    else window.location.hash = anker;
  } catch (e) {
    const teil = anker.replace('#', '').split('~');
    zustand.ansicht = teil[0] === 'spieler' && teil[1] ? 'profil' : teil[0];
    zustand.parameter = teil[1] || null;
    zeigeAnsicht();
  }
}

function beiAnkerwechsel() {
  const ziel = leseAnker();
  const wechsel = ziel.ansicht !== zustand.ansicht || ziel.parameter !== zustand.parameter;
  zustand.ansicht = ziel.ansicht;
  zustand.parameter = ziel.parameter;
  schliesseAlleBlaetter();
  versteckeTooltip();
  zeigeAnsicht();
  if (wechsel) window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
}

function zeigeAnsicht() {
  if (!zustand.modell) return;
  markiereNavigation();
  const bauer = {
    gesamt: ansichtGesamt,
    spiele: ansichtSpiele,
    spiel: ansichtSpiel,
    eintragen: ansichtEintragen,
    spieler: ansichtSpielerListe,
    profil: ansichtProfil,
    vergleich: ansichtVergleich,
    partien: ansichtPartien
  }[zustand.ansicht] || ansichtGesamt;
  let inhalt;
  try {
    inhalt = bauer();
  } catch (err) {
    console.error(err);
    setzeKopf('Fehler');
    inhalt = karte({ titel: 'Diese Ansicht konnte nicht angezeigt werden' }, h('p', { class: 'text-2' }, 'Bitte lade die Seite neu. Wenn der Fehler bleibt, schreib an ' + (kontaktEmail() || 'den Betreiber') + '.'), h('p', { class: 'text-3 sehr-klein' }, String(err && err.message ? err.message : err)));
  }
  ersetzeInhalt(elemente.inhalt, inhalt);
  elemente.inhalt.classList.remove('laedt-neu');
}

function zeigeLadebildschirm(text = 'Lade die Spieleabende …') {
  setzeKopf(null);
  ersetzeInhalt(elemente.inhalt, h('div', { class: 'laden-voll', role: 'status' },
    h('div', {}, h('div', { class: 'wuerfel-lader' }, h('i'), h('i'), h('i')), h('p', { class: 'text-2' }, text))));
}

async function ladeDaten(optionen = {}) {
  if (zustand.laedt) return;
  zustand.laedt = true;
  elemente.neuLaden.classList.add('dreht');
  if (!zustand.modell) zeigeLadebildschirm();
  else elemente.inhalt.classList.add('laedt-neu');
  try {
    const roh = await api.aufruf('list');
    uebernehmeRohdaten(roh);
    if (optionen.nachAnmeldung && api.pin) speicher.schreib('pin', api.pin);
    zeigeAnsicht();
    if (optionen.meldung) meldung(optionen.meldung);
    pruefeScriptVersion();
  } catch (err) {
    elemente.inhalt.classList.remove('laedt-neu');
    if (err.code === 'wrong_pin' || err.code === 'pin_required') {
      speicher.loesch('pin');
      api.pin = null;
      zeigeAnmeldung(optionen.nachAnmeldung ? err : null);
    } else if (err.code === 'locked') {
      zeigeAnmeldung(err);
    } else if (!zustand.modell) {
      zeigeVerbindungsfehler(err);
    } else {
      meldung(fehlerText(err), { art: 'fehler' });
    }
    if (optionen.nachAnmeldung) throw err;
  } finally {
    zustand.laedt = false;
    elemente.neuLaden.classList.remove('dreht');
  }
}

function uebernehmeRohdaten(roh) {
  zustand.roh = roh;
  zustand.modell = baueModell(roh);
}

/** Nach einer Änderung: Rohdaten anpassen und Modell neu bauen (ohne Netz) */
function aktualisiereRohdaten(aenderung) {
  aenderung(zustand.roh);
  zustand.modell = baueModell(zustand.roh);
}

function pruefeScriptVersion() {
  const v = zustand.modell && zustand.modell.version;
  if (!zustand.demo && v && v < BENOETIGTE_SCRIPT_VERSION && !zustand.versionGewarnt) {
    zustand.versionGewarnt = true;
    meldung('Das Script hat Version ' + v + '. Für „Spieler anlegen“ und „Spiele bearbeiten“ bitte Version ' + BENOETIGTE_SCRIPT_VERSION + ' einspielen (siehe Anleitung).', { art: 'fehler', dauer: 12000 });
  }
}

function zeigeVerbindungsfehler(err) {
  setzeKopf(null);
  ersetzeInhalt(elemente.inhalt, h('div', { class: 'laden-voll' },

// ---------------------------------------------------------------------------

let sperrTimer = null;

function zeigeAnmeldung(fehler) {
  const wurzel = document.getElementById('app');
  leeren(wurzel);
  document.querySelectorAll('.tableiste').forEach((n) => n.remove());
  document.title = SEITENTITEL;
  const eingabe = h('input', {
    class: 'eingabe', id: 'pin-eingabe', type: 'password', inputmode: 'text', autocomplete: 'current-password',
    autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'PIN', placeholder: 'PIN'
  });
  const auge = h('button', { type: 'button', class: 'symbol-knopf', 'aria-label': 'PIN anzeigen' }, symbol('auge', 20));
  auge.addEventListener('click', () => {
    const sichtbar = eingabe.type === 'text';
    eingabe.type = sichtbar ? 'password' : 'text';
    ersetzeInhalt(auge, symbol(sichtbar ? 'auge' : 'augeZu', 20));
    auge.setAttribute('aria-label', sichtbar ? 'PIN anzeigen' : 'PIN verbergen');
  });
  const knopf = h('button', { type: 'submit', class: 'knopf gold breit' }, 'Anmelden');
  const hinweis = h('div', { role: 'alert' });
  const formular = h('form', { class: 'stapel', novalidate: true },
    h('label', { class: 'versteckt', for: 'pin-eingabe' }, 'PIN'),
    h('div', { class: 'pin-feld' }, eingabe, auge),
    knopf,
    hinweis);
  const zeigeFehler = (err) => {
    clearInterval(sperrTimer);
    if (!err) { leeren(hinweis); return; }
    if (err.code === 'locked' && err.info && err.info.retryAfter) {
      let rest = err.info.retryAfter;
      knopf.disabled = true;
      const text = h('span');
      ersetzeInhalt(hinweis, h('div', { class: 'hinweis fehler' }, symbol('schloss', 18), h('div', {}, 'Zu viele Fehlversuche. Die Anmeldung ist für alle gesperrt. Noch ', text, '.')));
      const tick = () => {
        text.textContent = Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0') + ' Minuten';
        if (rest <= 0) { clearInterval(sperrTimer); knopf.disabled = false; leeren(hinweis); }
        rest--;
      };
      tick();
      sperrTimer = setInterval(tick, 1000);
    } else {
      ersetzeInhalt(hinweis, h('div', { class: 'hinweis fehler' }, symbol('warnung', 18), h('div', {}, fehlerText(err))));
    }
  };
  formular.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pin = eingabe.value.trim();
    if (!pin) { zeigeFehler({ code: 'pin_required' }); eingabe.focus(); return; }
    knopf.disabled = true;
    ersetzeInhalt(knopf, h('span', {}, 'Prüfe …'));
    api.pin = pin;
    try {
      baueGrundgeruest();
      await ladeDaten({ nachAnmeldung: true, meldung: 'Angemeldet. Dieses Gerät merkt sich den PIN.' });
    } catch (err) {
      // Anmeldung wird von ladeDaten neu gezeigt
    }
  });
  const kontakt = kontaktEmail();
  wurzel.appendChild(h('div', { class: 'anmeldung' },
    h('div', { class: 'anmelde-karte' },
      h('div', { class: 'anmelde-wuerfel', 'aria-hidden': 'true' },
        ['#3987e5', '#d95926', '#f3c35b', '#9085e9'].map((f) => h('span', { style: { background: f } }))),
      h('h1', { class: 'wortmarke' }, SEITENTITEL),
      h('p', { class: 'text-2' }, 'Ranglisten, Statistiken und Geschichte unserer Spielerunde. Bitte PIN eingeben.'),
      formular,
      kontakt ? h('p', { class: 'anmelde-kontakt' }, 'Kontakt: ', h('a', { class: 'kontakt', href: 'mailto:' + kontakt }, kontakt)) : null)));
  zeigeFehler(fehler);
  requestAnimationFrame(() => eingabe.focus());
}

async function abmelden(nachfragen = true) {
  if (nachfragen) {
    const ok = await bestaetigen({ titel: 'Abmelden?', text: 'Dieses Gerät vergisst den PIN. Beim nächsten Öffnen musst du ihn neu eingeben.', ja: 'Abmelden' });
    if (!ok) return;
  }
  speicher.loesch('pin');
  api.pin = null;
  zustand.modell = null;
  zustand.roh = null;
  schliesseAlleBlaetter();
  zeigeAnmeldung();
}

// ---------------------------------------------------------------------------

function abendTage() {
  const tage = [];
  for (const p of zustand.modell.aktivePartien) if (!tage.length || tage[tage.length - 1] !== p.tag) tage.push(p.tag);
  return tage;
}

function filterZeile() {
  const box = h('div', { class: 'stapel eng' });
  const zeile = h('div', { class: 'filterzeile', role: 'toolbar', 'aria-label': 'Zeitraum' });
  zeile.appendChild(h('button', { type: 'button', class: 'chip' + (zustand.zeitraumArt !== 'gesamt' ? ' aktiv' : ''), onclick: () => zeigeZeitraumWahl() },
    symbol('kalender', 16), zeitraumText(), symbol('runter', 14)));
  const tage = abendTage();
  if (tage.length > 1) {
    zeile.appendChild(h('button', {
      type: 'button', class: 'chip' + (zustand.zeitreise !== null ? ' aktiv' : ''), 'aria-pressed': zustand.zeitreiseOffen ? 'true' : 'false',
      onclick: () => { zustand.zeitreiseOffen = !zustand.zeitreiseOffen; if (!zustand.zeitreiseOffen) { stoppeAbspielen(); zustand.zeitreise = null; } zeigeAnsicht(); }
    }, symbol('uhr', 16), zustand.zeitreise !== null ? 'Stand ' + fmtDatum(zustand.zeitreise) : 'Zeitreise'));
  }
  zeile.appendChild(infoKnopf('zeitraum'));
  box.appendChild(zeile);
  if (zustand.zeitreiseOffen && tage.length > 1) box.appendChild(zeitreisePanel(tage));
  return box;
}

function zeitreisePanel(tage) {
  const index = zustand.zeitreise === null ? tage.length - 1 : Math.max(0, tage.findIndex((t) => t >= zustand.zeitreise));
  const regler = h('input', { type: 'range', id: 'zeitreise-regler', min: '0', max: String(tage.length - 1), step: '1', value: String(index), 'aria-label': 'Stichtag wählen', style: { width: '100%', accentColor: '#f3c35b' } });
  const anzeige = h('strong', {}, fmtDatumLang(tage[index]));
  const setze = (i, neuZeichnen = true) => {
    zustand.zeitreise = i >= tage.length - 1 ? null : tage[i];
    anzeige.textContent = fmtDatumLang(tage[i]);
    if (neuZeichnen) zeigeAnsichtBehalteScroll();
  };
  regler.addEventListener('input', entprellen(() => setze(Number(regler.value)), 120));
  const spielKnopf = h('button', { type: 'button', class: 'knopf klein', 'aria-label': zustand.abspielen ? 'Anhalten' : 'Abspielen' },
    symbol(zustand.abspielen ? 'pause' : 'play', 16), zustand.abspielen ? 'Anhalten' : 'Abspielen');
  spielKnopf.addEventListener('click', () => {
    if (zustand.abspielen) { stoppeAbspielen(); zeigeAnsichtBehalteScroll(); return; }
    let i = zustand.zeitreise === null ? 0 : Number(regler.value);
    if (i >= tage.length - 1) i = 0;
    zustand.zeitreise = tage[i];
    zustand.abspielen = setInterval(() => {
      i++;
      if (i >= tage.length - 1) { stoppeAbspielen(); zustand.zeitreise = null; }
      else zustand.zeitreise = tage[i];
      zeigeAnsichtBehalteScroll();
    }, 950);
    zeigeAnsichtBehalteScroll();
  });
  return h('div', { class: 'karte flach', style: { padding: '12px 14px' } },
    h('div', { class: 'zeile zwischen umbruch' }, h('span', { class: 'klein text-2' }, 'Stand am ', anzeige), spielKnopf),
    h('div', { style: { marginTop: '8px' } }, regler),
    h('div', { class: 'zeile zwischen sehr-klein text-3' }, h('span', {}, fmtDatum(tage[0])), h('span', {}, 'heute')));
}

function stoppeAbspielen() {
  if (zustand.abspielen) clearInterval(zustand.abspielen);
  zustand.abspielen = null;
}

function zeigeAnsichtBehalteScroll() {
  const y = window.scrollY;
  zeigeAnsicht();
  window.scrollTo(0, y);
}

function zeigeZeitraumWahl() {
  const liste = h('div', { class: 'stapel eng' });
  let schliessen;
  for (const z of ZEITRAEUME.filter((x) => x.art !== 'eigen')) {
    const g = zeitraumGrenzen(z.art);
    liste.appendChild(h('button', {
      type: 'button', class: 'knopf breit leise', style: { justifyContent: 'space-between' },
      onclick: () => { waehleZeitraum(z.art); schliessen(); }
    }, h('span', {}, z.text, h('span', { class: 'text-3 klein' }, g.von !== null ? '  ' + fmtDatum(g.von) + (g.bis !== null ? ' – ' + fmtDatum(g.bis) : ' – heute') : '')),
    zustand.zeitraumArt === z.art ? symbol('check', 18) : null));
  }
  const eigen = zustand.eigenerZeitraum || {};
  const vonFeld = h('input', { class: 'eingabe', type: 'date', id: 'zeitraum-von', value: eigen.von !== null && eigen.von !== undefined ? textAusTag(eigen.von) : '' });

function eloReihen(A, spiel) {
  const vonTag = A.zeitraum.von;
  const reihen = [];
  const lfdZuPartie = new Map(A.bisPartien.map((p) => [p.lfd, p]));
  for (const S of A.teilnehmer) {
    const quelle = spiel ? (S.proSpiel.get(spiel.key) || { verlauf: [] }).verlauf : S.verlauf;
    const imZeitraum = quelle.filter((v) => vonTag === null || v.tag >= vonTag);
    if (!imZeitraum.length) continue;
    const vorher = vonTag === null ? null : quelle.filter((v) => v.tag < vonTag).pop();
    const punkte = [];
    const achse = zustand.achse;
    if (vorher) punkte.push({ x: achse === 'datum' ? vonTag : imZeitraum[0].lfd - 0.5, y: vorher.elo, zusatz: 'Stand vorher' });
    else if (vonTag === null) punkte.push({ x: achse === 'datum' ? imZeitraum[0].tag : imZeitraum[0].lfd - 0.5, y: START_ELO, zusatz: 'Start' });
    for (const v of imZeitraum) {
      punkte.push({ x: achse === 'datum' ? v.tag : v.lfd, y: v.elo, zusatz: fmtDelta(v.delta, 1) + ' · ' + v.partie.spiel.name + ' · Platz ' + v.ergebnis.platz });
    }
    // Am selben Tag mehrere Partien: bei Datumsachse nur den letzten Stand des Tages zeigen
    const verdichtet = achse === 'datum' ? punkte.filter((p, i) => i === punkte.length - 1 || punkte[i + 1].x !== p.x) : punkte;
    reihen.push({ id: S.key, name: S.person.kuerzel, farbe: S.person.farbe, punkte: verdichtet });
  }
  return { reihen, lfdZuPartie };
}

      xName: (x) => {

      }
    });
    ersetzeInhalt(box,

function spielRangliste(G, art) {
  const def = {
    elo: { wert: (z) => z.SG.elo, text: (v) => fmtElo(v), gewertet: (z) => z.SG.gewertetElo, info: 'elo' },
    siegquote: { wert: (z) => z.SG.siegquote, text: (v) => fmtProzent(v), gewertet: (z) => z.SG.gewertet },
    score: { wert: (z) => z.SG.score, text: (v) => fmtProzent(v), gewertet: (z) => z.SG.gewertet, info: 'platzscore' },
    platz: { wert: (z) => (z.SG.platzSchnitt === null ? null : -z.SG.platzSchnitt), text: (v) => fmtKurz(-v, 2), gewertet: (z) => z.SG.gewertet },
    treppchen: { wert: (z) => z.SG.treppchenIndex, text: (v) => fmtZahl(v), gewertet: (z) => z.SG.gewertet, info: 'treppchen' },
    punkte: { wert: (z) => z.SG.punkteSchnitt, text: (v) => fmtKurz(v, 1), gewertet: (z) => z.SG.punkte.length >= MIN_PARTIEN },
    bestwert: { wert: (z) => z.SG.bestwert, text: (v) => fmtKurz(v, 1), gewertet: (z) => z.SG.punkte.length > 0 }
  }[art] || null;
  const zeilen = G.zeilen.filter((z) => def.wert(z) !== null && def.wert(z) !== undefined);
  zeilen.sort((a, b) => (b.S.person.aktiv - a.S.person.aktiv) || (def.gewertet(b) - def.gewertet(a)) || (def.wert(b) - def.wert(a)) || a.S.person.index - b.S.person.index);

  const gewertet = zeilen.filter((z) => def.gewertet(z) && z.S.person.aktiv);
  const rest = zeilen.filter((z) => !(def.gewertet(z) && z.S.person.aktiv));

// ---- 12-eintragen.js ----
// ===========================================================================
// Ansicht „Eintragen“: Spiel wählen, Spieler in Zielreihenfolge antippen,
// Punkte optional, speichern.
// ===========================================================================

function neuerEintrag(spielKey) {
  return {
    spielKey: spielKey || null,
    datum: textAusTag(spieleabendTag()),
    reihenfolge: [],
    punkte: {},
    anfrageId: null,
    fehler: null,
    speichert: false,
    zuletzt: (zustand.eintragen && zustand.eintragen.zuletzt) || []
  };
}

function starteEintragen(spielKey) {
  const alt = zustand.eintragen;
  zustand.eintragen = neuerEintrag(spielKey);
  if (alt && alt.datum) zustand.eintragen.datum = alt.datum;
}

function plaetzeAusReihenfolge(reihenfolge) {
  const plaetze = [];
  reihenfolge.forEach((r, i) => plaetze.push(i > 0 && r.gleichauf ? plaetze[i - 1] : i + 1));
  return plaetze;
}

function leseEingabePunkte(text) {
  const t = String(text === undefined || text === null ? '' : text).trim();
  if (!t) return { leer: true, wert: null };
  if (!/^-?\d+([.,]\d+)?$/.test(t)) return { fehler: true };
  const wert = Number(t.replace(',', '.'));
  if (!isFinite(wert) || Math.abs(wert) > 100000) return { fehler: true };
  return { wert };
}

function pruefeEintrag(e, spiel) {
  const probleme = [];
  if (!spiel) probleme.push('Wähle ein Spiel.');
  if (!tagAusText(e.datum)) probleme.push('Wähle ein gültiges Datum.');
  else if (tagAusText(e.datum) > heuteTag() + 1) probleme.push('Das Datum liegt zu weit in der Zukunft.');
  if (spiel && (e.reihenfolge.length < spiel.min || e.reihenfolge.length > spiel.max)) {
    probleme.push(spiel.name + ' ist für ' + spiel.min + ' bis ' + spiel.max + ' Spieler, gewählt sind ' + e.reihenfolge.length + '.');
  }
  for (const r of e.reihenfolge) {
    if (leseEingabePunkte(e.punkte[r.key]).fehler) { probleme.push('Die Punkte von ' + zustand.modell.spielerNach.get(r.key).kuerzel + ' sind keine gültige Zahl.'); break; }
  }
  return probleme;
}

/** Widersprechen die Punkte der Reihenfolge? */
function punkteWiderspruch(e) {
  const plaetze = plaetzeAusReihenfolge(e.reihenfolge);
  const werte = e.reihenfolge.map((r) => leseEingabePunkte(e.punkte[r.key]));
  for (let i = 1; i < werte.length; i++) {
    for (let j = 0; j < i; j++) {
      if (werte[i].wert === null || werte[i].wert === undefined || werte[j].wert === null || werte[j].wert === undefined) continue;
      if (plaetze[i] > plaetze[j] && werte[i].wert > werte[j].wert) return true;
    }
  }
  return false;
}

function sortiereNachPunkten(e) {
  const mit = e.reihenfolge.map((r, i) => ({ r, i, w: leseEingabePunkte(e.punkte[r.key]).wert }));
  if (mit.some((x) => x.w === null || x.w === undefined)) return false;
  mit.sort((a, b) => b.w - a.w || a.i - b.i);
  e.reihenfolge = mit.map((x, i) => ({ key: x.r.key, gleichauf: i > 0 && x.w === mit[i - 1].w }));
  return true;
}

function ansichtEintragen() {
  setzeKopf('Partie eintragen');
  if (!zustand.eintragen) zustand.eintragen = neuerEintrag();
  const e = zustand.eintragen;
  const modell = zustand.modell;
  const aktiveSpiele = modell.spiele.filter((sp) => sp.aktiv);
  let spiel = e.spielKey ? modell.spielNach.get(e.spielKey) : null;
  if (spiel && !spiel.aktiv) { e.spielKey = null; spiel = null; }
  e.reihenfolge = e.reihenfolge.filter((r) => { const p = modell.spielerNach.get(r.key); return p && p.aktiv; });
  const neuZeichnen = () => zeigeAnsichtBehalteScroll();

  if (!aktiveSpiele.length) {
    return h('div', { class: 'stapel weit' }, karte({}, leerZustand('spiele', 'Noch kein aktives Spiel', 'Leg zuerst ein Spiel an.', h('button', { type: 'button', class: 'knopf gold', onclick: () => zeigeSpielFormular() }, symbol('plus', 18), 'Spiel anlegen'))));
  }

    return h('div', { class: 'platzzeile' + (plaetze[i] === 1 ? ' p1' : '') },

  }));

/** Siegchancen einer Runde aus der Spiel-Elo */
function siegchancenKarte(spiel, personen, titel) {

  const zeilen = personen.map((p, i) => ({ p, elo: elos[i], chance: chancen[i] })).sort((a, b) => b.chance - a.chance);

async function speicherePartie() {
  const e = zustand.eintragen;
  const modell = zustand.modell;
  const spiel = e.spielKey ? modell.spielNach.get(e.spielKey) : null;
  const probleme = pruefeEintrag(e, spiel);
  if (probleme.length || e.speichert) return;
  if (!e.anfrageId) e.anfrageId = neueAnfrageId();
  e.speichert = true;
  e.fehler = null;
  zeigeAnsichtBehalteScroll();
  const plaetze = plaetzeAusReihenfolge(e.reihenfolge);
  const ergebnisse = e.reihenfolge.map((r, i) => ({
    spieler: modell.spielerNach.get(r.key).kuerzel,
    punkte: leseEingabePunkte(e.punkte[r.key]).wert,
    platz: plaetze[i]
  }));
  const vorher = auswerten(modell, {});
  try {
    const antwort = await api.aufruf('add', { datum: e.datum, spiel: spiel.name, ergebnisse, anfrageId: e.anfrageId });
    aktualisiereRohdaten((roh) => { roh.partien.push(...antwort.partien); });
    const nachher = auswerten(zustand.modell, {});
    const partie = zustand.modell.aktivePartien.find((p) => p.id === antwort.id);
    const neueErfolge = [];
    for (const [key, liste] of nachher.erfolge.jeSpieler) {
      const alt = vorher.erfolge.jeSpieler.get(key) || new Map();
      for (const [id, info] of liste) if (!alt.has(id)) neueErfolge.push({ person: zustand.modell.spielerNach.get(key), erfolg: ERFOLGE.find((x) => x.id === id), info });
    }
    const zuletzt = e.reihenfolge.map((r) => r.key);
    zustand.eintragen = Object.assign(neuerEintrag(null), { datum: e.datum, zuletzt });
    zeigeAnsichtBehalteScroll();
    if (partie) zeigeErgebnis(partie, neueErfolge);
    else meldung('Gespeichert.');
  } catch (err) {
    e.fehler = fehlerText(err);
    e.speichert = false;
    zeigeAnsichtBehalteScroll();
    meldung(e.fehler, { art: 'fehler' });
    return;
  }
}

  const ueberraschung = partie.siegerChance !== null && partie.siegerChance < 0.25 && partie.gewinner.length === 1

  const teilen = h('button', { type: 'button', class: 'knopf' }, symbol('teilen', 18), 'Als Bild teilen');
  const weiter = h('button', { type: 'button', class: 'knopf gold' }, symbol('plus', 18), 'Nächste Partie');
  const fertig = h('a', { class: 'knopf leise', href: '#gesamt' }, 'Zur Übersicht');

/**

function vergleichsAuswahlKarte(A, live = false) {
  const gewaehlt = new Set(zustand.vergleich.filter((k) => A.spieler.has(k)));
  const chips = h('div', { class: 'zeile umbruch' });
  const knopf = live ? null : h('button', { type: 'button', class: 'knopf gold', onclick: () => geheZu('#vergleich') });
  const aktualisiere = () => {
    zustand.vergleich = [...gewaehlt];
    speicher.schreib('vergleich', zustand.vergleich);
    if (!knopf) return;
    ersetzeInhalt(knopf, symbol('waage', 18), gewaehlt.size >= 2 ? mehrzahl(gewaehlt.size, 'Spieler', 'Spieler') + ' vergleichen' : 'Vergleich öffnen');
  };
  for (const S of A.teilnehmer) {
    const chip = h('button', { type: 'button', class: 'chip', 'aria-pressed': gewaehlt.has(S.key) ? 'true' : 'false' }, abzeichen(S.person, 'klein'), S.person.kuerzel);
    chip.style.paddingLeft = '4px';
    chip.addEventListener('click', () => {
      if (gewaehlt.has(S.key)) gewaehlt.delete(S.key);
      else if (gewaehlt.size < 4) gewaehlt.add(S.key);
      else { meldung('Höchstens vier Spieler gleichzeitig.', { art: 'fehler' }); return; }
      chip.setAttribute('aria-pressed', gewaehlt.has(S.key) ? 'true' : 'false');

function paarungsMatrix(A) {
  const personen = A.teilnehmer.map((S) => S.person);
  if (personen.length < 2) return h('p', { class: 'text-3 klein' }, 'Noch keine gemeinsamen Partien im Zeitraum.');
  const paar = (a, b) => A.paarungen.get(a.person.index < b.person.index ? a.key + '|' + b.key : b.key + '|' + a.key);
  // Zeilenköpfe nur als Abzeichen (das Kürzel steht darin), damit die Matrix auch am Handy passt
  const zeilen = A.teilnehmer.map((S) => ({ key: S.key, person: S.person, name: S.person.kuerzel, kopf: spielerLink(S.person, { ohneName: true, inaktivZeigen: false, groesse: 'klein' }) }));
  const spalten = A.teilnehmer.map((S) => ({ key: S.key, person: S.person, name: S.person.kuerzel, kopf: abzeichen(S.person, 'klein') }));
  const matrix = matrixDiagramm(zeilen, spalten, (z, sp) => {
    if (z.key === sp.key) return null;
    const rec = paar(z, sp);
    if (!rec || !rec.gemeinsam) return null;
    const zeileIstA = rec.a.key === z.key;
    const siege = zeileIstA ? rec.siegeA : rec.siegeB, niederlagen = zeileIstA ? rec.siegeB : rec.siegeA;
    const quote = (siege + rec.remis * 0.5) / rec.gemeinsam;
    return {
      farbe: divergierend((quote - 0.5) * 2), text: fmtZahl(quote * 100) + '%', blass: rec.gemeinsam < MIN_PARTIEN,
      tooltip: () => [ttTitel(z.name + ' gegen ' + sp.name), ttZeile(z.person.farbe, siege + ' : ' + niederlagen, 'Duelle', rec.remis ? rec.remis + ' gleichauf' : ''), ttZeile(null, mehrzahl(rec.gemeinsam, 'gemeinsame Partie', 'gemeinsame Partien'), '')],
      aktion: () => { zustand.vergleich = [z.key, sp.key]; zustand.vergleichBeruehrt = true; speicher.schreib('vergleich', zustand.vergleich); geheZu('#vergleich'); }
    };
  }, { zellBreite: 38 });
  return h('div', { class: 'stapel' },
    h('p', { class: 'sehr-klein text-3' }, 'Lesart: Zeile gegen Spalte. Der Wert ist der Anteil gewonnener Duelle der Zeile, gleiche Plätze zählen halb.'),
    matrix,
    h('div', { class: 'skala' }, h('span', {}, 'Spalte vorne'), h('span', { class: 'skala-band', style: { background: 'linear-gradient(90deg, ' + divergierend(-1) + ', ' + DIV_MITTE + ', ' + divergierend(1) + ')' } }), h('span', {}, 'Zeile vorne'), h('span', { style: { marginLeft: 'auto' } }, 'Feld antippen: Zweier-Vergleich')));
}

  };
  zeichne();
  return box;

/** Aus dem Profil: Person zur Auswahl hinzufügen; steht sie allein, kommt der stärkste andere Spieler dazu. */
function vergleicheMit(person) {
  const A = aktuelleAuswertung();
  const v = new Set(zustand.vergleich.filter((k) => A.spieler.has(k)));
  v.delete(person.key);
  let liste = [...v].slice(-3).concat(person.key);
  if (liste.length < 2) {
    const anderer = A.rangElo.find((S) => S.key !== person.key && S.partienGesamt);
    if (anderer) liste = [anderer.key, person.key];
  }
  zustand.vergleich = liste;
  zustand.vergleichBeruehrt = true;
  speicher.schreib('vergleich', zustand.vergleich);
  geheZu('#vergleich');
}

function ansichtVergleich() {
  setzeKopf('Vergleich', '#spieler');
  const A = aktuelleAuswertung();
  // Beim ersten Öffnen ohne eigene Auswahl: die beiden Führenden der Elo-Rangliste vorwählen
  const gueltig = (k) => { const S = A.spieler.get(k); return S && S.partienGesamt; };
  if (!zustand.vergleichBeruehrt && zustand.vergleich.filter(gueltig).length < 2 && A.rangElo.length >= 2) {
    zustand.vergleich = A.rangElo.slice(0, 2).map((S) => S.key);
  }
  const wurzel = h('div', { class: 'stapel weit' }, filterZeile(), vergleichsAuswahlKarte(A, true));
  const gewaehlt = zustand.vergleich.map((k) => A.spieler.get(k)).filter((S) => S && S.partienGesamt);
  if (gewaehlt.length < 2) {
    wurzel.appendChild(karte({}, leerZustand('waage', 'Wähle zwei bis vier Spieler', 'Tippe oben auf die Kürzel. Bei zwei Spielern gibt es zusätzlich die direkte Bilanz.')));
    return wurzel;
  }
  if (gewaehlt.length === 2) wurzel.appendChild(zweierVergleich(A, gewaehlt[0], gewaehlt[1]));
  wurzel.appendChild(kennzahlVergleich(A, gewaehlt));
  const spiele = zustand.modell.spiele.filter((sp) => gewaehlt.some((S) => { const SG = S.proSpiel.get(sp.key); return SG && SG.partien; }));
  wurzel.appendChild(karte({ augenbraue: 'Stärken je Spiel', titel: 'Netzdiagramm', info: 'platzscore' },
    netzDiagramm(spiele.map((sp) => ({ name: sp.name })), gewaehlt.map((S) => ({
      id: S.key, name: S.person.kuerzel, farbe: S.person.farbe,
      werte: spiele.map((sp) => { const SG = S.proSpiel.get(sp.key); return SG && SG.partien ? SG.score : null; }),
      texte: spiele.map((sp) => { const SG = S.proSpiel.get(sp.key); return SG && SG.partien ? 'Platz-Score ' + fmtProzent(SG.score) + ' (' + SG.partien + ')' : 'keine Partie'; })
    }))),
    h('p', { class: 'sehr-klein text-3' }, 'Je weiter außen, desto besser platziert in diesem Spiel (Platzierungs-Score im Zeitraum).')));
  wurzel.appendChild(fusszeile());
  return wurzel;
}

function kennzahlVergleich(A, liste) {
  // wert(S) liefert die Vergleichszahl: der beste Wert je Zeile wird golden hervorgehoben.
  // Partien werden bewusst nicht hervorgehoben (viel mitspielen ist kein Verdienst).
  const zeile = (titel, text, wert) => {
    const zahlen = wert ? liste.map((S) => wert(S)) : [];
    const gueltig = zahlen.filter((v) => v !== null && v !== undefined && isFinite(v));
    const bestes = gueltig.length > 1 ? Math.max(...gueltig) : null;
    return [h('strong', { style: { whiteSpace: 'normal' } }, titel)].concat(liste.map((S, i) => {
      const spitze = bestes !== null && zahlen[i] === bestes && gueltig.some((v) => v !== bestes);
      return spitze ? h('span', { class: 'bester-wert', title: 'bester Wert' }, text(S)) : text(S);
    }));
  };
  const kurzname = (sp) => h('span', { title: sp.name }, sp.name.split(' ')[0]);
  return karte({ augenbraue: 'Kennzahlen', titel: 'Nebeneinander' },
    datenTabelle([{ titel: '', links: true }].concat(liste.map((S) => ({ titel: S.person.kuerzel }))), [
      zeile('Elo', (S) => fmtElo(S.elo), (S) => S.elo),
      zeile('Stufe', (S) => (S.stufe ? S.stufe.name : 'vorläufig')),
      zeile('Partien', (S) => fmtZahl(S.gesamt.partien)),
      zeile('Siegquote', (S) => fmtProzent(S.gesamt.siegquote), (S) => S.gesamt.siegquote),
      zeile('Über Erwartung', (S) => fmtPP(S.gesamt.ueberErwartung), (S) => S.gesamt.ueberErwartung),
      zeile('Platz-Score', (S) => fmtProzent(S.gesamt.score), (S) => S.gesamt.score),
      zeile('Treppchen', (S) => fmtZahl(S.gesamt.treppchenIndex), (S) => S.gesamt.treppchenIndex),
      zeile('Konstanz', (S) => fmtProzent(S.gesamt.konstanz), (S) => S.gesamt.konstanz),
      zeile('Paradespiel', (S) => (S.paradespiel ? kurzname(S.paradespiel.spiel) : '–'))
    ]),
    h('p', { class: 'sehr-klein text-3' }, 'Golden: bester Wert der Auswahl. Partien werden nicht hervorgehoben, weil Häufigkeit kein Verdienst ist.'));
}

function zweierVergleich(A, S1, S2) {
  const a = S1.person, b = S2.person;
  const schluessel = a.index < b.index ? a.key + '|' + b.key : b.key + '|' + a.key;
  const rec = A.paarungen.get(schluessel);
  const siegeA = rec ? (rec.a.key === a.key ? rec.siegeA : rec.siegeB) : 0;
  const siegeB = rec ? (rec.a.key === a.key ? rec.siegeB : rec.siegeA) : 0;
  const gemeinsamePartien = A.partien.filter((p) => p.ergebnisse.some((e) => e.key === a.key) && p.ergebnisse.some((e) => e.key === b.key));
  const jeSpiel = new Map();
  for (const p of gemeinsamePartien) {
    const ea = p.ergebnisse.find((e) => e.key === a.key), eb = p.ergebnisse.find((e) => e.key === b.key);
    const x = jeSpiel.get(p.spiel.key) || { spiel: p.spiel, a: 0, b: 0, gleich: 0 };
    if (ea.platz < eb.platz) x.a++; else if (ea.platz > eb.platz) x.b++; else x.gleich++;
    jeSpiel.set(p.spiel.key, x);
  }
  const kopf = h('div', { class: 'zeile', style: { justifyContent: 'center', gap: '18px', flexWrap: 'wrap' } },
    h('div', { class: 'stapel eng', style: { alignItems: 'center' } }, abzeichen(a, 'gross'), h('strong', {}, a.kuerzel)),
    h('div', { class: 'stapel eng', style: { alignItems: 'center' } }, h('span', { class: 'heldenzahl', style: { fontSize: '44px' } }, siegeA + ' : ' + siegeB), h('span', { class: 'sehr-klein text-3' }, rec ? mehrzahl(rec.gemeinsam, 'gemeinsame Partie', 'gemeinsame Partien') + (rec.remis ? ', ' + rec.remis + ' gleichauf' : '') : 'noch keine gemeinsame Partie')),
    h('div', { class: 'stapel eng', style: { alignItems: 'center' } }, abzeichen(b, 'gross'), h('strong', {}, b.kuerzel)));
  // Bilanz je Spiel als geteilter Balken: links Siege der ersten Person, Mitte gleich platziert, rechts Siege der zweiten
  const GLEICH_FARBE = '#4a5263';
  const spielZeilen = [...jeSpiel.values()].sort((m, n) => (n.a + n.b + n.gleich) - (m.a + m.b + m.gleich));
  const tabelle = spielZeilen.length ? h('div', { class: 'stapel eng' }, h('span', { class: 'augenbraue' }, 'Bilanz je Spiel'),
    gestapelteBalken(spielZeilen.map((x) => ({
      name: x.spiel.name,
      label: spielLabel(x.spiel),
      teile: [{ name: a.kuerzel + ' vorne', wert: x.a, farbe: a.farbe }, { name: 'gleich platziert', wert: x.gleich, farbe: GLEICH_FARBE }, { name: b.kuerzel + ' vorne', wert: x.b, farbe: b.farbe }]
    })), [{ name: a.kuerzel + ' vorne', farbe: a.farbe }, { name: 'gleich', farbe: GLEICH_FARBE }, { name: b.kuerzel + ' vorne', farbe: b.farbe }],
    { labelBreite: '104px', rechts: (z) => z.teile[0].wert + ' : ' + z.teile[2].wert })) : null;
  const verlauf = linienDiagramm([S1, S2].map((S) => ({
    id: S.key, name: S.person.kuerzel, farbe: S.person.farbe,
    punkte: S.verlauf.filter((v) => A.zeitraum.von === null || v.tag >= A.zeitraum.von).map((v) => ({ x: v.tag, y: v.elo })).filter((p, i, arr) => i === arr.length - 1 || arr[i + 1].x !== p.x)
  })), { xTyp: 'datum', bezug: START_ELO, hoehe: 220, xName: (x) => fmtDatumLang(x) });
  return karte({ augenbraue: 'Zweier-Vergleich', titel: a.kuerzel + ' gegen ' + b.kuerzel },
    kopf, tabelle,
    h('div', { class: 'stapel eng' }, h('span', { class: 'augenbraue' }, 'Elo-Verläufe übereinander'), verlauf),
    gemeinsamePartien.length ? h('div', { class: 'stapel eng' }, h('span', { class: 'augenbraue' }, 'Letzte gemeinsame Partien'), gemeinsamePartien.slice(-5).reverse().map((p) => partieKarte(p, { hervorheben: [a.key, b.key] }))) : null);
}

  const ok = await bestaetigen({
    titel: 'Partie löschen?',
    text: (p.spiel ? p.spiel.name : 'Partie') + ' vom ' + fmtDatum(p.tag) + ' (' + p.id + ') verschwindet aus allen Auswertungen. Sie bleibt in der Tabelle markiert und lässt sich jederzeit wiederherstellen.',
    ja: 'Löschen', gefahr: true
  });
  if (!ok) return;
  try {
    const antwort = await api.aufruf('delete', { id: p.id });
    aktualisiereRohdaten((roh) => { roh.partien.filter((z) => z.id === p.id).forEach((z) => { z.geloescht = antwort.geloescht || new Date().toISOString(); }); });
    zeigeAnsichtBehalteScroll();
    meldung('Partie ' + p.id + ' gelöscht.', { aktion: { text: 'Rückgängig', fn: () => stellePartieWiederHer(p.id) } });
  } catch (err) {
    meldung(fehlerText(err), { art: 'fehler' });
  }
}

async function stellePartieWiederHer(id) {
  try {
    await api.aufruf('restore', { id });
    aktualisiereRohdaten((roh) => { roh.partien.filter((z) => z.id === id).forEach((z) => { z.geloescht = null; }); });
    zeigeAnsichtBehalteScroll();
    meldung('Partie ' + id + ' wiederhergestellt.');
  } catch (err) {
    meldung(fehlerText(err), { art: 'fehler' });
  }
}

function ansichtPartien() {
  setzeKopf('Partien');
  const modell = zustand.modell;
  const f = zustand.partienFilter;
  const zr = aktuellerZeitraum();
  const imZeitraum = (p) => p.tag === null || ((zr.von === null || p.tag >= zr.von) && (zr.bis === null || p.tag <= zr.bis));
  const suchtext = normSchluessel(f.suche);
  const passt = (p) => {
    if (!imZeitraum(p)) return false;
    if (f.spiel && (!p.spiel || p.spiel.key !== f.spiel)) return false;
    if (f.spieler && !p.ergebnisse.some((e) => e.key === f.spieler)) return false;
    if (suchtext) {
      const heuhaufen = normSchluessel([p.id, p.spiel ? p.spiel.name : '', fmtDatum(p.tag)].concat(p.ergebnisse.map((e) => e.key)).join(' '));
      if (!heuhaufen.includes(suchtext)) return false;
    }
    return true;
  };
  const liste = modell.partien.filter((p) => (f.geloeschte || !p.geloescht) && p.gueltig && passt(p));
  const fehlerhaft = modell.fehlerhaftePartien.filter((p) => !p.geloescht);

  // Filter
  const suche = h('input', { class: 'eingabe', type: 'search', id: 'partien-suche', placeholder: 'Suche nach Spieler, Spiel, Datum oder ID', value: f.suche, 'aria-label': 'Partien durchsuchen' });
  suche.addEventListener('input', entprellen(() => { f.suche = suche.value; f.anzahl = 12; zeigeAnsichtBehalteScroll(); const neu = document.getElementById('partien-suche'); if (neu) { neu.focus(); neu.setSelectionRange(neu.value.length, neu.value.length); } }, 300));
  const spielWahl = h('select', { class: 'auswahl', id: 'partien-spiel', 'aria-label': 'Spiel filtern' },
    h('option', { value: '' }, 'Alle Spiele'), modell.spiele.map((sp) => h('option', { value: sp.key, selected: sp.key === f.spiel }, sp.name)));
  spielWahl.addEventListener('change', () => { f.spiel = spielWahl.value; f.anzahl = 12; zeigeAnsichtBehalteScroll(); });
  const spielerWahl = h('select', { class: 'auswahl', id: 'partien-spieler', 'aria-label': 'Spieler filtern' },
    h('option', { value: '' }, 'Alle Spieler'), modell.spieler.map((sp) => h('option', { value: sp.key, selected: sp.key === f.spieler }, sp.kuerzel)));
  spielerWahl.addEventListener('change', () => { f.spieler = spielerWahl.value; f.anzahl = 12; zeigeAnsichtBehalteScroll(); });
  const geloeschtSchalter = h('input', { type: 'checkbox', id: 'partien-geloeschte', checked: f.geloeschte });
  geloeschtSchalter.addEventListener('change', () => { f.geloeschte = geloeschtSchalter.checked; zeigeAnsichtBehalteScroll(); });
  const filterKarte = karte({},
    suche,
    h('div', { class: 'raster zwei' }, spielWahl, spielerWahl),
    h('label', { class: 'zeile', for: 'partien-geloeschte', style: { cursor: 'pointer' } },
      h('span', { class: 'schalter' }, geloeschtSchalter, h('span', { class: 'spur' })),
      h('span', { class: 'klein text-2' }, 'Gelöschte Partien zeigen (' + modell.geloeschtePartien.length + ')')));

  // Nach Abenden gruppieren, neueste zuerst
  const abende = new Map();
  for (const p of liste.slice().reverse()) {
    if (!abende.has(p.tag)) abende.set(p.tag, []);
    abende.get(p.tag).push(p);
  }
  const abendListe = [...abende.entries()];
  const sichtbar = abendListe.slice(0, f.anzahl);
  const listenBox = h('div', {});
  for (const [tag, partien] of sichtbar) {
    listenBox.appendChild(h('div', { class: 'abend-kopf' }, h('h3', {}, fmtDatumLang(tag)), h('span', { class: 'sehr-klein text-3' }, mehrzahl(partien.length, 'Partie', 'Partien'))));
    for (const p of partien.slice().reverse()) {
      const aktion = p.geloescht
        ? h('button', { type: 'button', class: 'knopf klein', onclick: () => stellePartieWiederHer(p.id) }, symbol('wiederherstellen', 16), 'Wiederherstellen')
        : h('button', { type: 'button', class: 'knopf klein leise', onclick: () => loeschePartie(p), 'aria-label': 'Partie ' + p.id + ' löschen' }, symbol('papierkorb', 16), 'Löschen');
      const teilen = !p.geloescht ? h('button', { type: 'button', class: 'knopf klein leise', onclick: () => teilePartie(p), 'aria-label': 'Partie ' + p.id + ' als Bild teilen' }, symbol('teilen', 16), 'Teilen') : null;
      listenBox.appendChild(partieKarte(p, { aktionen: [teilen, aktion] }));
    }
  }
  if (!sichtbar.length) listenBox.appendChild(karte({}, leerZustand('partien', 'Keine Partien gefunden', 'Ändere die Suche oder den Zeitraum.')));
  const mehr = abendListe.length > f.anzahl
    ? h('button', { type: 'button', class: 'knopf breit', style: { marginTop: '16px' }, onclick: () => { f.anzahl += 12; zeigeAnsichtBehalteScroll(); } }, 'Weitere Abende laden (' + (abendListe.length - f.anzahl) + ' übrig)')
    : null;

  return h('div', { class: 'stapel' },
    filterZeile(),
    filterKarte,
    fehlerhaft.length ? karte({ klasse: 'fehler-karte', augenbraue: 'Bitte prüfen', titel: mehrzahl(fehlerhaft.length, 'Partie wird', 'Partien werden') + ' nicht gewertet' },
      h('p', { class: 'klein text-2' }, 'Diese Zeilen wurden vermutlich von Hand in der Tabelle geändert und passen nicht zusammen. Korrigiere sie in der Tabelle oder lösche sie hier.'),
      fehlerhaft.map((p) => partieKarte(p, { mitDatum: true, aktionen: [h('button', { type: 'button', class: 'knopf klein leise', onclick: () => loeschePartie(p) }, symbol('papierkorb', 16), 'Löschen')] }))) : null,
    h('p', { class: 'klein text-3' }, mehrzahl(liste.length, 'Partie', 'Partien') + ' an ' + mehrzahl(abendListe.length, 'Abend', 'Abenden') + (f.suche || f.spiel || f.spieler ? ' (gefiltert)' : '')),
    listenBox,
    mehr,
    fusszeile());
}

// ---- 16-rueckblick.js ----
// ===========================================================================
// Jahresrückblick: das Spieljahr als Karten zum Durchwischen
// ===========================================================================

function rueckblickDaten(jahr) {
  const modell = zustand.modell;
  const A = auswerten(modell, { von: jahrStart(jahr), bis: jahrEnde(jahr) });
  const partien = A.partien;
  const d = { jahr, A, partien, anzahl: partien.length, abende: A.abende.length };
  // Meistgespieltes Spiel
  const jeSpiel = [...A.spiele.values()].filter((G) => G.anzahl).sort((a, b) => b.anzahl - a.anzahl);
  d.lieblingsspiel = jeSpiel[0] || null;
  d.spieleAnzahl = jeSpiel.length;
  d.mitPunkten = partien.filter((p) => p.hatPunkte).length;
  // Elo-Spitze am Jahresende
  d.spitze = A.teilnehmer.filter((S) => S.gewertetElo).sort((a, b) => b.elo - a.elo).slice(0, 3);
  // Bester Treppchen-Index mit mindestens der Hälfte der Partien
  const noetig = Math.max(QUARTAL_MIN_PARTIEN, partien.length * QUARTAL_TEILNAHME);
  d.treppchen = A.teilnehmer.filter((S) => S.gesamt.partien >= noetig - 1e-9).sort((a, b) => b.gesamt.treppchenIndex - a.gesamt.treppchenIndex)[0] || null;
  d.treppchenNoetig = Math.ceil(noetig - 1e-9);
  // Längste Siegesserie im Jahr
  let serie = null;
  for (const S of A.teilnehmer) if (!serie || S.gesamt.serie.laengsteSieg > serie.laenge) serie = { S, laenge: S.gesamt.serie.laengsteSieg };
  d.serie = serie && serie.laenge >= 2 ? serie : null;
  // Größte Überraschung
  const ueberraschungen = partien.filter((p) => p.gewinner.length === 1 && p.siegerChance !== null).sort((a, b) => a.siegerChance - b.siegerChance);
  d.ueberraschung = ueberraschungen[0] && ueberraschungen[0].siegerChance < 1 / ueberraschungen[0].n ? ueberraschungen[0] : null;
  // Engste Rivalität
  const paare = [...A.paarungen.values()].filter((r) => r.gemeinsam >= 5).map((r) => ({ r, abstand: Math.abs((r.siegeA + r.remis * 0.5) / r.gemeinsam - 0.5) }))
    .sort((a, b) => a.abstand - b.abstand || b.r.gemeinsam - a.r.gemeinsam);
  d.rivalitaet = paare[0] ? paare[0].r : null;
  // Spieler der Quartale
  d.quartale = A.quartale.filter((q) => q.jahr === jahr).sort((a, b) => a.q - b.q);
  // Aktivster Monat
  const monate = new Map();
  for (const p of partien) monate.set(monatVon(p.tag), (monate.get(monatVon(p.tag)) || 0) + 1);
  d.topMonat = [...monate.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  return d;
}

function zeigeJahresrueckblick(jahr) {
  const jahre = [...new Set(zustand.modell.aktivePartien.map((p) => jahrVon(p.tag)))].sort((a, b) => b - a);
  if (!jahre.length) return;
  let d = rueckblickDaten(jahr);
  let index = 0;
  const karten = () => {

    const karte2 = buehne.querySelector('.geschichte-karte');

  };
  const taste = (ev) => {
    if (ev.key === 'ArrowRight') { index = Math.min(liste.length - 1, index + 1); zeige(); }
    else if (ev.key === 'ArrowLeft') { index = Math.max(0, index - 1); zeige(); }
    else if (ev.key === 'Escape') schliessen();
  };
  let startX = null;
  ueberlagerung.addEventListener('touchstart', (ev) => { startX = ev.touches[0].clientX; }, { passive: true });
  ueberlagerung.addEventListener('touchend', (ev) => {
    if (startX === null) return;
    const dx = ev.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) { index = klemme(index + (dx < 0 ? 1 : -1), 0, liste.length - 1); zeige(); }
    startX = null;
  });
  const schliessen = () => { ueberlagerung.remove(); document.removeEventListener('keydown', taste); document.body.style.overflow = ''; };
  schliessenKnopf.addEventListener('click', schliessen);
  document.addEventListener('keydown', taste);
  document.body.appendChild(ueberlagerung);
  document.body.style.overflow = 'hidden';
  zeige();
  requestAnimationFrame(() => ueberlagerung.focus());
}

// ===========================================================================
// Demo-Modus: erfundene Runde mit erfundenen Kürzeln, nur zum Ausprobieren.
// Enthält keine echten Daten. Aufruf der Seite mit ?demo
// ===========================================================================

function erzeugeDemoDaten() {
  const rnd = mulberry32(20260930);
  const normal = () => {
    const u = Math.max(1e-9, rnd()), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const spiele = [
    { name: 'Brass Birmingham', min: 2, max: 4, aktiv: true },
    { name: 'Vale of Eternity', min: 2, max: 4, aktiv: true },
    { name: 'Siedler von Catan', min: 3, max: 4, aktiv: true },
    { name: 'Ikki', min: 2, max: 4, aktiv: true }
  ];
  const personen = [
    { kuerzel: 'ALX', staerke: [0.9, 0.1, 0.35, 0.3], da: 0.86 },
    { kuerzel: 'BEA', staerke: [0.35, 0.85, 0.2, 0.55], da: 0.9 },
    { kuerzel: 'CEM', staerke: [0.5, 0.35, 0.75, 0.05], da: 0.68 },
    { kuerzel: 'DOR', staerke: [-0.15, 0.1, 0.3, 0.85], da: 0.8 },
    { kuerzel: 'EMI', staerke: [0.15, 0.55, -0.05, 0.2], da: 0.55 },
    { kuerzel: 'FYN', staerke: [-0.35, -0.2, 0.55, 0.0], da: 0.74 },
    { kuerzel: 'GIL', staerke: [0.25, 0.0, 0.05, 0.1], da: 0.8, bis: 110 }
  ];
  const rauschen = [0.55, 0.8, 1.15, 0.7];
  const gewichte = [0.3, 0.32, 0.18, 0.2];
  const ende = heuteTag() - 3;
  const start = ende - 470;
  const zeilen = [];
  let nr = 0;
  const waehleSpiel = (erlaubt) => {
    const summeG = summe(erlaubt.map((i) => gewichte[i]));
    let x = rnd() * summeG;
    for (const i of erlaubt) { x -= gewichte[i]; if (x <= 0) return i; }
    return erlaubt[erlaubt.length - 1];
  };
  const mische = (liste) => {
    const a = liste.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  for (let tag = start; tag <= ende; tag += 5 + Math.floor(rnd() * 6)) {
    if (rnd() < 0.22) continue;
    const tagIndex = tag - start;
    const anwesend = personen.filter((p) => (p.bis === undefined || tagIndex <= p.bis) && rnd() < p.da);
    if (anwesend.length < 2) continue;
    const runden = 2 + Math.floor(rnd() * 3);
    let partieImAbend = 0;
    for (let runde = 0; runde < runden; runde++) {
      let frei = mische(anwesend);
      const benutzt = new Set();
      while (frei.length >= 2) {
        const moeglich = spiele.map((s, i) => i).filter((i) => spiele[i].min <= frei.length && !benutzt.has(i));
        if (!moeglich.length) break;
        const g = waehleSpiel(moeglich);
        benutzt.add(g);
        const spiel = spiele[g];
        let groesse = Math.min(spiel.max, frei.length);
        if (frei.length - groesse === 1 && groesse - 1 >= spiel.min) groesse--;
        if (groesse > spiel.min && rnd() < 0.18) groesse--;
        const tisch = frei.slice(0, groesse);
        frei = frei.slice(groesse);
        const leistung = tisch.map((p) => ({ p, wert: p.staerke[g] + rauschen[g] * normal() }))
          .sort((a, b) => b.wert - a.wert);
        const plaetze = [];
        leistung.forEach((l, i) => {
          if (i > 0 && Math.abs(leistung[i - 1].wert - l.wert) < 0.025) plaetze.push(plaetze[i - 1]);
          else plaetze.push(i + 1);
        });
        const ohnePunkte = (g === 3 && rnd() < 0.3) || (g === 1 && rnd() < 0.06);
        let punkte = leistung.map((l) => {
          if (g === 0) return Math.round(128 + 26 * l.wert + normal() * 6);
          if (g === 1) return Math.round(56 + 11 * l.wert + normal() * 4);
          if (g === 3) return Math.round(72 + 16 * l.wert + normal() * 6);
          return 0;
        });
        if (g === 2) punkte = leistung.map((l, i) => (i === 0 ? (rnd() < 0.15 ? 11 : 10) : Math.max(3, 9 - i - Math.floor(rnd() * 2))));
        // Punkte passend zur Reihenfolge absteigend sortieren, Gleichstand = gleiche Punkte
        punkte.sort((a, b) => b - a);
        for (let i = 1; i < punkte.length; i++) {
          if (plaetze[i] === plaetze[i - 1]) punkte[i] = punkte[i - 1];
          else if (punkte[i] >= punkte[i - 1]) punkte[i] = punkte[i - 1] - 1;
        }
        nr++;
        const id = 'P' + String(nr).padStart(5, '0');
        const t = teileAusTag(tag);
        const erstellt = new Date(Date.UTC(t.jahr, t.monat - 1, t.tag, 18, 20) + partieImAbend * 55 * 60000).toISOString();
        partieImAbend++;
        const geloescht = nr === 37 ? new Date(Date.UTC(t.jahr, t.monat - 1, t.tag, 23, 5)).toISOString() : null;
        leistung.forEach((l, i) => {
          zeilen.push({
            id, datum: textAusTag(tag), spiel: spiel.name, spieler: l.p.kuerzel,
            punkte: ohnePunkte ? null : punkte[i], platz: plaetze[i], geloescht, erstellt
          });
        });
      }
    }
  }
  return {
    version: BENOETIGTE_SCRIPT_VERSION,
    spiele,
    spieler: personen.map((p) => ({ kuerzel: p.kuerzel, aktiv: p.bis === undefined })),
    partien: zeilen
  };
}

/** Demo-Speicher: verhält sich wie das echte Script, nur im Arbeitsspeicher */
function erstelleDemoBackend() {
  const daten = erzeugeDemoDaten();
  const wiederholt = new Map();
  const finde = (liste, feld, wert) => liste.find((x) => normSchluessel(x[feld]) === normSchluessel(wert));
  const kopie = (x) => JSON.parse(JSON.stringify(x));
  const fehler = (code, detail) => new ApiFehler(code, detail ? { detail } : {});

  return async function (action, felder) {
    await warte(250 + Math.random() * 300);
    if (felder && felder.anfrageId && wiederholt.has(action + felder.anfrageId)) return kopie(wiederholt.get(action + felder.anfrageId));
    let ergebnis;
    switch (action) {
      case 'check':
        ergebnis = { version: daten.version };
        break;
      case 'list':
        ergebnis = daten;
        break;
      case 'add': {
        const spiel = finde(daten.spiele, 'name', felder.spiel);
        if (!spiel || !spiel.aktiv) throw fehler('invalid_game');
        const erg = felder.ergebnisse || [];
        if (erg.length < spiel.min || erg.length > spiel.max) throw fehler('invalid_player_count', spiel.min + '-' + spiel.max);
        const gesehen = new Set();
        for (const e of erg) {
          const person = finde(daten.spieler, 'kuerzel', e.spieler);
          if (!person || !person.aktiv) throw fehler('invalid_player', e.spieler);
          if (gesehen.has(normSchluessel(e.spieler))) throw fehler('duplicate_player', e.spieler);
          gesehen.add(normSchluessel(e.spieler));
          if (e.punkte !== null && e.punkte !== undefined && e.punkte !== '' && !isFinite(Number(String(e.punkte).replace(',', '.')))) throw fehler('invalid_points', e.spieler);
        }
        const plaetze = erg.map((e) => e.platz);
        for (const pl of plaetze) if (pl !== plaetze.filter((q) => q < pl).length + 1) throw fehler('invalid_places');
        const hoechste = daten.partien.reduce((m, z) => Math.max(m, parseInt(z.id.slice(1), 10) || 0), 0);
        const id = 'P' + String(hoechste + 1).padStart(5, '0');
        const erstellt = new Date().toISOString();
        const neu = erg.slice().sort((a, b) => a.platz - b.platz).map((e) => ({
          id, datum: felder.datum, spiel: spiel.name, spieler: finde(daten.spieler, 'kuerzel', e.spieler).kuerzel,
          punkte: e.punkte === null || e.punkte === undefined || e.punkte === '' ? null : Number(String(e.punkte).replace(',', '.')),
          platz: e.platz, geloescht: null, erstellt
        }));
        daten.partien.push(...neu);
        ergebnis = { id, partien: neu };
        break;
      }
      case 'delete':
      case 'restore': {
        const treffer = daten.partien.filter((z) => z.id === felder.id);
        if (!treffer.length) throw fehler('not_found');
        const marke = action === 'delete' ? new Date().toISOString() : null;
        treffer.forEach((z) => { z.geloescht = marke; });
        ergebnis = { id: felder.id, geloescht: marke };
        break;
      }
      case 'addGame': {
        const name = String(felder.name || '').replace(/\s+/g, ' ').trim();
        if (!name || name.length > 40) throw fehler('invalid_name');
        const min = Number(felder.min), max = Number(felder.max);
        if (!Number.isInteger(min) || !Number.isInteger(max) || min < 2 || max < min || max > 12) throw fehler('invalid_min_max');
        if (finde(daten.spiele, 'name', name)) throw fehler('game_exists');
        daten.spiele.push({ name, min, max, aktiv: true });
        ergebnis = { name, min, max, aktiv: true };
        break;
      }
      case 'addPlayer': {
        const kuerzel = String(felder.kuerzel || '').trim();
        if (!/^[A-Za-z0-9ÄÖÜäöüß][A-Za-z0-9ÄÖÜäöüß._-]{0,11}$/.test(kuerzel)) throw fehler('invalid_kuerzel');
        if (finde(daten.spieler, 'kuerzel', kuerzel)) throw fehler('player_exists');
        daten.spieler.push({ kuerzel, aktiv: true });
        ergebnis = { kuerzel, aktiv: true };
        break;
      }
      case 'setPlayer': {
        const person = finde(daten.spieler, 'kuerzel', felder.kuerzel);
        if (!person) throw fehler('not_found');
        if (typeof felder.aktiv !== 'boolean') throw fehler('invalid_value');
        person.aktiv = felder.aktiv;
        ergebnis = { kuerzel: person.kuerzel, aktiv: person.aktiv };
        break;
      }
      case 'setGame': {
        const spiel = finde(daten.spiele, 'name', felder.name);
        if (!spiel) throw fehler('not_found');
        const min = felder.min !== undefined ? Number(felder.min) : spiel.min;
        const max = felder.max !== undefined ? Number(felder.max) : spiel.max;
        if (!Number.isInteger(min) || !Number.isInteger(max) || min < 2 || max < min || max > 12) throw fehler('invalid_min_max');
        if (felder.aktiv !== undefined && typeof felder.aktiv !== 'boolean') throw fehler('invalid_value');
        spiel.min = min; spiel.max = max;
        if (felder.aktiv !== undefined) spiel.aktiv = felder.aktiv;
        ergebnis = kopie(spiel);
        break;
      }
      default:
        throw fehler('unknown_action');
    }
    const antwort = kopie(ergebnis);
    if (felder && felder.anfrageId) wiederholt.set(action + felder.anfrageId, antwort);
    return kopie(antwort);
  };
}

// ===========================================================================
// Als Bild teilen: Ranglisten, Partie-Ergebnisse und Profile als PNG
// ===========================================================================

const BILD_B = 1080, BILD_H = 1350;

async function bildLeinwand() {
  try { if (document.fonts && document.fonts.load) await document.fonts.load('600 64px "Cinzel Spieleabend"'); } catch (e) { /* Ersatzschrift */ }
  const c = document.createElement('canvas');
  c.width = BILD_B;
  c.height = BILD_H;
  const x = c.getContext('2d');
  const verlauf = x.createLinearGradient(0, 0, 0, BILD_H);
  verlauf.addColorStop(0, '#0d1220');
  verlauf.addColorStop(1, '#05070b');
  x.fillStyle = verlauf;
  x.fillRect(0, 0, BILD_B, BILD_H);
  const leuchten = (cx, cy, r, farbe) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, farbe);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, BILD_B, BILD_H);
  };
  leuchten(120, -80, 700, 'rgba(243,195,91,0.20)');
  leuchten(1100, 260, 600, 'rgba(95,212,196,0.10)');
  leuchten(540, 1500, 800, 'rgba(144,133,233,0.14)');
  // Wortmarke
  const gold = x.createLinearGradient(0, 0, BILD_B, 0);
  gold.addColorStop(0, '#f8dc97'); gold.addColorStop(0.5, '#f3c35b'); gold.addColorStop(1, '#c98a2b');
  x.fillStyle = gold;
  x.font = '600 58px "Cinzel Spieleabend", Georgia, serif';
  x.textAlign = 'center';
  x.fillText(SEITENTITEL.toUpperCase().split('').join(' '), BILD_B / 2, 118);
  return { c, x, gold };
}

function bildText(x, text, px, py, groesse, farbe, gewicht = 600, ausrichtung = 'left', schrift = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif') {
  x.font = gewicht + ' ' + groesse + 'px ' + schrift;
  x.fillStyle = farbe;
  x.textAlign = ausrichtung;
  x.fillText(text, px, py);
}

function bildAbzeichen(x, person, cx, cy, r) {
  x.beginPath();
  x.arc(cx, cy, r + 5, 0, Math.PI * 2);
  x.fillStyle = '#0b0f17';
  x.fill();
  x.beginPath();
  x.arc(cx, cy, r, 0, Math.PI * 2);
  x.fillStyle = person.farbe;
  x.fill();
  const glanz = x.createRadialGradient(cx - r * 0.4, cy - r * 0.5, 0, cx, cy, r);
  glanz.addColorStop(0, 'rgba(255,255,255,0.3)');
  glanz.addColorStop(0.5, 'rgba(255,255,255,0)');
  x.fillStyle = glanz;
  x.fill();
  bildText(x, kurzname(person).toUpperCase(), cx, cy + r * 0.3, Math.round(r * 0.78), person.textFarbe, 800, 'center');
}

function bildRundRechteck(x, px, py, b, hh, r, fuellung) {
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + b, py, px + b, py + hh, r);
  x.arcTo(px + b, py + hh, px, py + hh, r);
  x.arcTo(px, py + hh, px, py, r);
  x.arcTo(px, py, px + b, py, r);
  x.closePath();
  x.fillStyle = fuellung;
  x.fill();
}

function bildFuss(x, text) {
  bildText(x, text, BILD_B / 2, BILD_H - 50, 26, '#7d8699', 500, 'center');
}

async function teileBild(c, dateiname, titel) {
  const blob = await new Promise((fertig) => c.toBlob(fertig, 'image/png'));
  if (!blob) { meldung('Das Bild konnte nicht erzeugt werden.', { art: 'fehler' }); return; }
  const datei = typeof File !== 'undefined' ? new File([blob], dateiname, { type: 'image/png' }) : null;
  try {
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: titel });
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  // In der Vorschau-Fassung (Claude-Artefakt) sind Downloads gesperrt: dort nur das Bild zeigen
  const vorschau = DEMO_ERZWUNGEN;
  const herunterladen = vorschau ? null : h('a', { class: 'knopf gold', href: url, download: dateiname }, symbol('herunterladen', 18), 'Bild speichern');
  zeigeBlatt({
    titel: 'Bild teilen',
    inhalt: h('div', { class: 'stapel' }, h('img', { class: 'bild-vorschau', src: url, alt: titel }),
      h('p', { class: 'klein text-3' }, vorschau
        ? 'In dieser Vorschau lässt sich das Bild nicht speichern. Auf der echten Seite öffnet sich am Handy das Teilen-Menü, am PC gibt es „Bild speichern“.'
        : 'Am Handy: Bild lange antippen, um es zu speichern oder weiterzugeben.')),
    aktionen: herunterladen ? [herunterladen] : [],
    beimSchliessen: () => setTimeout(() => URL.revokeObjectURL(url), 1000)
  });
}

async function teileRangliste(A, istElo) {
  const { c, x } = await bildLeinwand();
  const liste = (istElo ? A.rangElo.filter((S) => S.rangElo !== null) : A.rangTreppchen.filter((S) => S.rangTreppchen !== null)).slice(0, 8);
  bildText(x, istElo ? 'Rangliste · Elo' : 'Rangliste · Treppchen-Index', BILD_B / 2, 186, 38, '#eef1f7', 700, 'center');
  bildText(x, zustand.zeitreise !== null ? 'Stand ' + fmtDatum(zustand.zeitreise) : zeitraumText() + ' · ' + fmtDatum(heuteTag()), BILD_B / 2, 232, 28, '#a9b1c3', 500, 'center');
  // Podium
  const podestFarben = { 1: ['#f9dc93', '#9c6a22'], 2: ['#eef2f7', '#6f7a8b'], 3: ['#f0b98e', '#7a4724'] };
  const positionen = [{ nr: 2, cx: 250, hoehe: 150 }, { nr: 1, cx: 540, hoehe: 210 }, { nr: 3, cx: 830, hoehe: 110 }];
  const boden = 700;
  for (const pos of positionen) {
    const S = liste[pos.nr - 1];
    const g = x.createLinearGradient(0, boden - pos.hoehe, 0, boden);
    g.addColorStop(0, podestFarben[pos.nr][0]); g.addColorStop(1, podestFarben[pos.nr][1]);
    bildRundRechteck(x, pos.cx - 120, boden - pos.hoehe, 240, pos.hoehe, 18, g);
    bildText(x, String(pos.nr), pos.cx, boden - pos.hoehe + 64, 54, '#1b1305', 600, 'center', '"Cinzel Spieleabend", Georgia, serif');
    if (!S) continue;
    const cy = boden - pos.hoehe - 170;
    bildAbzeichen(x, S.person, pos.cx, cy, pos.nr === 1 ? 70 : 58);
    bildText(x, S.person.kuerzel, pos.cx, cy + 112, 36, '#eef1f7', 700, 'center');
    bildText(x, istElo ? fmtElo(S.elo) : fmtZahl(S.gesamt.treppchenIndex), pos.cx, cy + 152, pos.nr === 1 ? 40 : 34, pos.nr === 1 ? '#f8dc97' : '#c9d2de', 800, 'center');
  }
  // Weitere Plätze
  let y = 790;
  liste.slice(3).forEach((S, i) => {
    bildRundRechteck(x, 120, y - 50, 840, 78, 18, 'rgba(255,255,255,0.05)');
    bildText(x, (i + 4) + '.', 170, y + 2, 32, '#7d8699', 700, 'center');
    bildAbzeichen(x, S.person, 240, y - 11, 26);
    bildText(x, S.person.kuerzel, 290, y + 1, 32, '#eef1f7', 700);
    bildText(x, istElo ? fmtElo(S.elo) : fmtZahl(S.gesamt.treppchenIndex), 920, y + 1, 32, '#eef1f7', 800, 'right');
    y += 92;
  });
  if (!liste.length) bildText(x, 'Noch niemand mit ' + MIN_PARTIEN + ' Partien', BILD_B / 2, 520, 34, '#a9b1c3', 600, 'center');
  bildFuss(x, mehrzahl(A.partien.length, 'Partie', 'Partien') + ' · ' + mehrzahl(A.abende.length, 'Abend', 'Abende'));
  await teileBild(c, 'rangliste.png', 'Rangliste ' + SEITENTITEL);
}

async function teilePartie(partie) {
  const { c, x } = await bildLeinwand();
  const sp = partie.spiel;
  // Spielfarbe als Leuchten und Symbol
  const g = x.createRadialGradient(900, 260, 0, 900, 260, 520);
  g.addColorStop(0, mitAlpha(sp.farbe, 0.32)); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, BILD_B, BILD_H);
  bildText(x, sp.name, BILD_B / 2, 205, 52, '#eef1f7', 600, 'center', '"Cinzel Spieleabend", Georgia, serif');
  bildText(x, fmtDatumLang(partie.tag), BILD_B / 2, 256, 28, '#a9b1c3', 500, 'center');
  let y = 380;
  for (const e of partie.ergebnisse) {
    const sieger = e.platz === 1;
    bildRundRechteck(x, 110, y - 62, 860, 112, 24, sieger ? 'rgba(243,195,91,0.14)' : 'rgba(255,255,255,0.05)');
    bildText(x, e.platz + '.', 180, y + 12, 46, sieger ? '#f3c35b' : '#7d8699', 600, 'center', '"Cinzel Spieleabend", Georgia, serif');
    bildAbzeichen(x, e.person, 270, y - 6, 36);
    bildText(x, e.person.kuerzel, 330, y + 6, 40, '#eef1f7', 700);
    if (e.punkte !== null) bildText(x, fmtKurz(e.punkte, 1) + ' Punkte', 330, y + 40, 24, '#a9b1c3', 500);
    if (e.eloDelta !== undefined) {
      const d = e.eloDelta;
      bildText(x, (d >= 0 ? '▲ ' : '▼ ') + fmtZahl(Math.abs(d), 1), 930, y + 2, 34, d >= 0 ? '#3ecf6e' : '#ff7a7a', 800, 'right');
      bildText(x, 'Elo', 930, y + 36, 22, '#7d8699', 500, 'right');
    }
    y += 132;
  }
  if (partie.siegerChance !== null && partie.gewinner.length === 1 && partie.siegerChance < 0.25) {
    bildText(x, 'Überraschung: nur ' + fmtProzent(partie.siegerChance) + ' Siegchance vorher', BILD_B / 2, Math.min(y + 30, BILD_H - 120), 30, '#5fd4c4', 600, 'center');
  }
  bildFuss(x, 'Partie ' + partie.id);
  await teileBild(c, 'partie-' + partie.id + '.png', sp.name + ' · ' + fmtDatum(partie.tag));
}

async function teileProfil(S, A) {
  const { c, x } = await bildLeinwand();
  const p = S.person;
  const g = x.createRadialGradient(540, 420, 0, 540, 420, 520);
  g.addColorStop(0, mitAlpha(p.farbe, 0.35)); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, BILD_B, BILD_H);
  bildAbzeichen(x, p, 540, 380, 120);
  bildText(x, p.kuerzel, 540, 580, 72, '#eef1f7', 600, 'center', '"Cinzel Spieleabend", Georgia, serif');
  bildText(x, (S.stufe ? S.stufe.name + ' · ' : '') + 'Elo ' + fmtElo(S.elo), 540, 640, 38, '#f3c35b', 700, 'center');
  const werte = [
    ['Partien', fmtZahl(S.gesamt.partien)],
    ['Siegquote', fmtProzent(S.gesamt.siegquote)],
    ['Platz-Score', fmtProzent(S.gesamt.score)],
    ['Treppchen', fmtZahl(S.gesamt.treppchenIndex)]
  ];
  werte.forEach(([name, wert], i) => {
    const cx = 150 + (i % 2) * 400, cy = 740 + Math.floor(i / 2) * 190;
    bildRundRechteck(x, cx, cy, 380, 160, 26, 'rgba(255,255,255,0.05)');
    bildText(x, name.toUpperCase(), cx + 30, cy + 50, 24, '#7d8699', 700);
    bildText(x, wert, cx + 30, cy + 120, 60, '#eef1f7', 800);
  });
  if (S.paradespiel) bildText(x, 'Paradespiel: ' + S.paradespiel.spiel.name, 540, 1170, 32, '#a9b1c3', 600, 'center');
  bildFuss(x, zeitraumText() + ' · ' + fmtDatum(heuteTag()));
  await teileBild(c, 'profil-' + p.slug + '.png', 'Profil ' + p.kuerzel);
}

function start() {
  window.addEventListener('hashchange', beiAnkerwechsel);
  window.addEventListener('unhandledrejection', (ev) => { console.error(ev.reason); });
  let demo = DEMO_ERZWUNGEN;
  try { demo = demo || new URLSearchParams(window.location.search).has('demo'); } catch (e) { /* egal */ }
  const ziel = leseAnker();
  zustand.ansicht = ziel.ansicht;
  zustand.parameter = ziel.parameter;
  if (demo) {
    api.demo = erstelleDemoBackend();
    zustand.demo = true;
  } else {
    api.pin = speicher.lies('pin');
    if (!api.pin) { zeigeAnmeldung(); return; }
  }
  baueGrundgeruest();
  ladeDaten();
}

start();
