  modell.partien.sort((a, b) =>
    (a.tag === null ? 1e9 : a.tag) - (b.tag === null ? 1e9 : b.tag) ||
    a.erstelltMs - b.erstelltMs || a.nummer - b.nummer || a.id.localeCompare(b.id));

  verteileSpielThemen(modell.spiele);
  verteileSpielerFarben(modell.spieler);

  for (const p of modell.partien) {
    if (p.geloescht) modell.geloeschtePartien.push(p);
    else if (!p.gueltig) modell.fehlerhaftePartien.push(p);
    else modell.aktivePartien.push(p);
  }
  modell.aktivePartien.forEach((p, i) => { p.lfd = i + 1; });

  berechneEloVerlauf(modell);
  return modell;
}

/** Prüft eine Partie auf Widersprüche (z. B. nach Handarbeit in der Tabelle) */
function pruefePartie(p) {
  if (!p.spiel) return 'Spiel fehlt';
  if (p.tag === null) return 'Datum unlesbar';
  if (p.n < 2) return 'Weniger als zwei Spieler';
  if (p.ergebnisse.some((e) => !e.person)) return 'Spieler fehlt';
  const keys = new Set(p.ergebnisse.map((e) => e.key));
  if (keys.size !== p.n) return 'Spieler doppelt';
  if (p.ergebnisse.some((e) => e.platz === null || !Number.isInteger(e.platz) || e.platz < 1 || e.platz > p.n)) return 'Platz fehlt oder ungültig';
  const plaetze = p.ergebnisse.map((e) => e.platz);
  for (const pl of plaetze) {
    const besser = plaetze.filter((q) => q < pl).length;
    if (pl !== besser + 1) return 'Plätze passen nicht zusammen';
  }
  return null;
}

/**
 * Elo-Änderungen einer Partie. Jedes Spielerpaar zählt als Duell,
 * K wird durch (Spielerzahl − 1) geteilt. Alle Änderungen werden mit den
 * Werten vor der Partie berechnet und gleichzeitig angewendet.
 */
function eloAenderungen(plaetze, vorher) {
  const n = plaetze.length;
  const delta = new Array(n).fill(0);
  if (n < 2) return delta;
  const kPaar = K_FAKTOR / (n - 1);
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const erwartet = 1 / (1 + Math.pow(10, (vorher[j] - vorher[i]) / 400));
      const ergebnis = plaetze[i] < plaetze[j] ? 1 : plaetze[i] === plaetze[j] ? 0.5 : 0;
      const d = kPaar * (ergebnis - erwartet);
      delta[i] += d;
      delta[j] -= d;
    }
  }
  return delta;
}

/** Siegchancen aller am Tisch (Luce-Modell): Stärke 10^(Elo/400), Anteil an der Summe */
function siegchancen(elos) {
  if (!elos.length) return [];
  const max = Math.max(...elos);
  const staerken = elos.map((e) => Math.pow(10, (e - max) / 400));
  const gesamt = summe(staerken);
  return staerken.map((x) => x / gesamt);
}

/** Werte einer Partie, die nur von den Plätzen abhängen */
function berechnePartieWerte(p) {
  const n = p.n;
  const jePlatz = new Map();
  for (const e of p.ergebnisse) jePlatz.set(e.platz, (jePlatz.get(e.platz) || 0) + 1);
  let treppchenSumme = 0;
  for (const e of p.ergebnisse) {
    const gleich = jePlatz.get(e.platz);
    const mittlererRang = e.platz + (gleich - 1) / 2;
    e.gleichauf = gleich > 1;
    e.score = (n - mittlererRang) / (n - 1);
    let pkt = 0;
    for (let pos = e.platz; pos < e.platz + gleich; pos++) pkt += treppchenPunkteFuerPlatz(n, pos);
    e.treppchen = pkt / gleich;
    e.sieg = e.platz === 1;
    e.siegAnteil = e.platz === 1 ? 1 / gleich : 0;
    e.letzter = e.platz + gleich - 1 === n && e.platz > 1;
    treppchenSumme += e.treppchen;
  }
  p.treppchenSchnitt = treppchenSumme / n;
  for (const e of p.ergebnisse) e.treppchenQuote = p.treppchenSchnitt > 0 ? e.treppchen / p.treppchenSchnitt : 1;
  p.gewinner = p.ergebnisse.filter((e) => e.sieg);
}

/** Einmaliger chronologischer Durchlauf über alle gültigen Partien */
function berechneEloVerlauf(modell) {
  const gesamt = new Map();
  const anzahl = new Map();
  const proSpiel = new Map();
  const anzahlSpiel = new Map();
  for (const p of modell.aktivePartien) {
    berechnePartieWerte(p);
    const tn = p.ergebnisse;
    const plaetze = tn.map((e) => e.platz);
    const pool = proSpiel.get(p.spiel.key) || new Map();
    proSpiel.set(p.spiel.key, pool);
    const zaehler = anzahlSpiel.get(p.spiel.key) || new Map();
    anzahlSpiel.set(p.spiel.key, zaehler);

    const vorG = tn.map((e) => (gesamt.has(e.key) ? gesamt.get(e.key) : START_ELO));
    const vorS = tn.map((e) => (pool.has(e.key) ? pool.get(e.key) : START_ELO));
    const dG = eloAenderungen(plaetze, vorG);
    const dS = eloAenderungen(plaetze, vorS);
    const chancen = siegchancen(vorS);

    tn.forEach((e, i) => {
      e.eloVor = vorG[i];
      e.eloDelta = dG[i];
      e.eloNach = vorG[i] + dG[i];
      e.spielEloVor = vorS[i];
      e.spielEloDelta = dS[i];
      e.spielEloNach = vorS[i] + dS[i];
      e.chance = chancen[i];
      e.nrGesamt = (anzahl.get(e.key) || 0) + 1;
      e.nrSpiel = (zaehler.get(e.key) || 0) + 1;
      gesamt.set(e.key, e.eloNach);
      pool.set(e.key, e.spielEloNach);
      anzahl.set(e.key, e.nrGesamt);
      zaehler.set(e.key, e.nrSpiel);
    });

    // Favorit: eindeutig höchste Spiel-Elo vor der Partie
    let bester = -1, zweiter = -Infinity, besterWert = -Infinity;
    tn.forEach((e, i) => {
      if (e.spielEloVor > besterWert) { zweiter = besterWert; besterWert = e.spielEloVor; bester = i; }
      else if (e.spielEloVor > zweiter) zweiter = e.spielEloVor;
    });
    if (bester >= 0 && besterWert - zweiter > 0.5) {
      p.favorit = tn[bester];
    } else {
      p.favorit = null;
    }
    // Größte Überraschung: kleinste Siegchance unter den Siegern
    p.siegerChance = p.gewinner.length ? Math.min(...p.gewinner.map((e) => e.chance)) : null;
  }
}

// ---- 06-rechnen.js ----
// ===========================================================================
// Rechenkern: alle Auswertungen für einen Zeitraum
// Grundsatz: Wertungen vergleichen mit den anderen am Tisch und rechnen in
// Quoten und Durchschnitten. Absolute Zahlen sind nur Info.
// ===========================================================================

function zeitraumSchluessel(zr) {
  return (zr && zr.von !== null && zr.von !== undefined ? zr.von : '') + '|' + (zr && zr.bis !== null && zr.bis !== undefined ? zr.bis : '');
}

function leereKennzahlen() {
  return {
    partien: 0, siege: 0, siegAnteilSumme: 0, erwartetSumme: 0, platzSumme: 0,
    scores: [], quoteSumme: 0, treppchenSumme: 0, letzte: 0,
    platzVerteilung: [0, 0, 0, 0, 0], liste: []
  };
}

function kennzahlHinzufuegen(k, p, e) {
  k.partien++;
  if (e.sieg) k.siege++;
  k.siegAnteilSumme += e.siegAnteil;
  k.erwartetSumme += 1 / p.n;
  k.platzSumme += e.platz;
  k.scores.push(e.score);
  k.quoteSumme += e.treppchenQuote;
  k.treppchenSumme += e.treppchen;
  if (e.letzter) k.letzte++;
  k.platzVerteilung[Math.min(e.platz, 5) - 1]++;
  k.liste.push({ p, e });
}

function kennzahlAbschliessen(k) {
  const n = k.partien;
  k.gewertet = n >= MIN_PARTIEN;
  k.siegquote = n ? k.siege / n : null;
  k.erwartet = n ? k.erwartetSumme / n : null;
  k.ueberErwartung = n ? (k.siegAnteilSumme - k.erwartetSumme) / n : null;
  k.platzSchnitt = n ? k.platzSumme / n : null;
  k.score = n ? mittel(k.scores) : null;
  k.treppchenIndex = n ? (k.quoteSumme / n) * 100 : null;
  // Konstanz: Streuung der Platzierungs-Scores im Vergleich zur Streuung,
  // die reiner Zufall bei denselben Tischgrößen hätte. 50 % = wie Zufall,
  // mehr = beständiger, weniger = wechselhafter.
  const streu = stdabw(k.scores);
  if (n >= MIN_PARTIEN && streu !== null) {
    const zufallsVarianz = mittel(k.liste.map(({ p }) => (p.n + 1) / (12 * (p.n - 1))));
    k.konstanzVerhaeltnis = streu / Math.sqrt(zufallsVarianz);
    k.konstanz = klemme(1.5 - k.konstanzVerhaeltnis, 0, 1);
  } else {
    k.konstanzVerhaeltnis = null;
    k.konstanz = null;
  }
  // Form: die letzten fünf eigenen Partien, neueste zuerst
  k.form = k.liste.slice(-5).reverse();
  // Serien in chronologischer Reihenfolge
  let sieg = 0, ohne = 0, maxSieg = 0, maxOhne = 0;
  for (const { e } of k.liste) {
    if (e.sieg) { sieg++; ohne = 0; } else { ohne++; sieg = 0; }
    maxSieg = Math.max(maxSieg, sieg);
    maxOhne = Math.max(maxOhne, ohne);
  }
  k.serie = { aktuellSieg: sieg, aktuellOhne: ohne, laengsteSieg: maxSieg, laengsteOhne: maxOhne };
  return k;
}

/** Hauptfunktion: Auswertung für einen Zeitraum { von, bis } (Tage, jeweils optional) */
function auswerten(modell, zr) {
  zr = zr || {};
  if (!modell._cache) modell._cache = new Map();
  const schluessel = zeitraumSchluessel(zr);
  if (modell._cache.has(schluessel)) return modell._cache.get(schluessel);

  const bisTag = zr.bis !== null && zr.bis !== undefined ? zr.bis : Infinity;
  const vonTag = zr.von !== null && zr.von !== undefined ? zr.von : -Infinity;
  const bisPartien = modell.aktivePartien.filter((p) => p.tag <= bisTag);
  const imZeitraum = bisPartien.filter((p) => p.tag >= vonTag);
  const imZeitraumSet = new Set(imZeitraum);

  const A = {
    zeitraum: { von: zr.von === undefined ? null : zr.von, bis: zr.bis === undefined ? null : zr.bis },
    modell,
    bisPartien,
    partien: imZeitraum,
    spieler: new Map(),
    spiele: new Map(),
    abende: [],
    aktivitaet: new Map(),
    paarungen: new Map()
  };

  // --- Grundgerüst je Spieler --------------------------------------------
  for (const person of modell.spieler) {
    const S = {
      person, key: person.key,
      elo: START_ELO, eloVon: START_ELO, partienGesamt: 0, verlauf: [],
      eloHoch: null, eloTief: null,
      gesamt: leereKennzahlen(),
      proSpiel: new Map(),
      gegner: new Map(),
      abendTage: new Set(),
      zuletzt: null
    };
    A.spieler.set(person.key, S);
  }
  const spielKennzahl = (S, spiel) => {
    if (!S.proSpiel.has(spiel.key)) {
      S.proSpiel.set(spiel.key, Object.assign(leereKennzahlen(), {
        spiel, elo: START_ELO, partienGesamt: 0, verlauf: [], punkte: []
      }));
    }
    return S.proSpiel.get(spiel.key);
  };

  // --- Elo-Stand bis zum Stichtag ----------------------------------------
  for (const p of bisPartien) {
    for (const e of p.ergebnisse) {
      const S = A.spieler.get(e.key);
      if (p.tag < vonTag) S.eloVon = e.eloNach;
      S.elo = e.eloNach;
      S.partienGesamt = e.nrGesamt;
      S.verlauf.push({ tag: p.tag, lfd: p.lfd, elo: e.eloNach, delta: e.eloDelta, partie: p, ergebnis: e });
      if (p.tag >= vonTag) {
        S.eloHoch = S.eloHoch === null ? e.eloNach : Math.max(S.eloHoch, e.eloNach);
        S.eloTief = S.eloTief === null ? e.eloNach : Math.min(S.eloTief, e.eloNach);
      }
      const SG = spielKennzahl(S, p.spiel);
      SG.elo = e.spielEloNach;
      SG.partienGesamt = e.nrSpiel;
      SG.verlauf.push({ tag: p.tag, lfd: p.lfd, elo: e.spielEloNach, delta: e.spielEloDelta, partie: p, ergebnis: e });
    }
  }

  // --- Kennzahlen im Zeitraum --------------------------------------------
  const abendMap = new Map();
  for (const p of imZeitraum) {
    if (!abendMap.has(p.tag)) abendMap.set(p.tag, []);
    abendMap.get(p.tag).push(p);
    A.aktivitaet.set(p.tag, (A.aktivitaet.get(p.tag) || 0) + 1);
    for (const e of p.ergebnisse) {
      const S = A.spieler.get(e.key);
      kennzahlHinzufuegen(S.gesamt, p, e);
      const SG = spielKennzahl(S, p.spiel);
      kennzahlHinzufuegen(SG, p, e);
      if (e.punkte !== null) SG.punkte.push({ tag: p.tag, lfd: p.lfd, wert: e.punkte, platz: e.platz, partie: p });
      S.abendTage.add(p.tag);
      S.zuletzt = S.zuletzt === null ? p.tag : Math.max(S.zuletzt, p.tag);
      // Direkte Duelle
      for (const o of p.ergebnisse) {
        if (o === e) continue;
        const g = S.gegner.get(o.key) || { person: o.person, gemeinsam: 0, siege: 0, niederlagen: 0, remis: 0 };
        g.gemeinsam++;
        if (e.platz < o.platz) g.siege++; else if (e.platz > o.platz) g.niederlagen++; else g.remis++;
        S.gegner.set(o.key, g);
      }
    }
    // Paarungen (für Matrix und Mitspieler-Netz)
    for (let i = 0; i < p.ergebnisse.length; i++) {
      for (let j = i + 1; j < p.ergebnisse.length; j++) {
        let a = p.ergebnisse[i], b = p.ergebnisse[j];
        if (a.person.index > b.person.index) [a, b] = [b, a];
        const k = a.key + '|' + b.key;
        const rec = A.paarungen.get(k) || { a: a.person, b: b.person, gemeinsam: 0, siegeA: 0, siegeB: 0, remis: 0 };
        rec.gemeinsam++;
        if (a.platz < b.platz) rec.siegeA++; else if (a.platz > b.platz) rec.siegeB++; else rec.remis++;
        A.paarungen.set(k, rec);
      }
    }
  }
  A.abende = [...abendMap.entries()].map(([tag, partien]) => ({ tag, partien })).sort((a, b) => b.tag - a.tag);
  const anzahlAbende = A.abende.length;

  // --- Abschluss je Spieler ----------------------------------------------
  for (const S of A.spieler.values()) {
    kennzahlAbschliessen(S.gesamt);
    for (const SG of S.proSpiel.values()) {
      kennzahlAbschliessen(SG);
      SG.gewertetElo = SG.partienGesamt >= MIN_PARTIEN;
      SG.eloVorZeitraum = START_ELO;
      for (const v of SG.verlauf) if (v.tag < vonTag) SG.eloVorZeitraum = v.elo;
      const werte = SG.punkte.map((x) => x.wert);
      SG.punkteSchnitt = werte.length ? mittel(werte) : null;
      SG.bestwert = werte.length ? Math.max(...werte) : null;
      SG.punkteSortiert = werte.slice().sort((a, b) => a - b);
      SG.punkteTrend = SG.punkte.length >= 3 ? regression(SG.punkte.map((x) => x.lfd), werte) : null;
    }
    S.gewertetElo = S.partienGesamt >= MIN_PARTIEN;
    S.stufe = S.gewertetElo ? stufeFuer(S.elo) : null;
    S.eloDeltaZeitraum = S.gesamt.partien ? S.elo - S.eloVon : 0;
    S.eloTrend = summe(S.verlauf.slice(-5).map((v) => v.delta));
    S.abende = S.abendTage.size;
    S.abendAnteil = anzahlAbende ? S.abende / anzahlAbende : null;
    S.partienProAbend = S.abende ? S.gesamt.partien / S.abende : null;
    for (const g of S.gegner.values()) g.quote = (g.siege + g.remis * 0.5) / g.gemeinsam;
    const gegnerListe = [...S.gegner.values()].filter((g) => g.gemeinsam >= MIN_PARTIEN);
    gegnerListe.sort((a, b) => a.quote - b.quote || b.gemeinsam - a.gemeinsam);
    S.angstgegner = gegnerListe.length && gegnerListe[0].quote < 0.5 ? gegnerListe[0] : null;
    const besteGegner = gegnerListe.slice().sort((a, b) => b.quote - a.quote || b.gemeinsam - a.gemeinsam);
    S.lieblingsgegner = besteGegner.length && besteGegner[0].quote > 0.5 ? besteGegner[0] : null;
    const spieleGewertet = [...S.proSpiel.values()].filter((SG) => SG.gewertetElo && SG.partienGesamt > 0);
    spieleGewertet.sort((a, b) => b.elo - a.elo);
    S.paradespiel = spieleGewertet.length ? spieleGewertet[0] : null;
    const gespielt = [...S.proSpiel.values()].filter((SG) => SG.partien > 0);
    gespielt.sort((a, b) => b.partien - a.partien || (b.liste.length ? b.liste[b.liste.length - 1].p.tag : 0) - (a.liste.length ? a.liste[a.liste.length - 1].p.tag : 0));
    S.lieblingsspiel = gespielt.length ? gespielt[0] : null;
  }

  // --- Ranglisten gesamt --------------------------------------------------
  const teilnehmer = [...A.spieler.values()].filter((S) => S.gesamt.partien > 0);
  A.teilnehmer = teilnehmer;
  // Inaktive Spieler bleiben in allen Statistiken, bekommen aber keinen Ranglistenplatz
  A.rangElo = teilnehmer.slice().sort((a, b) => (b.person.aktiv - a.person.aktiv) || (b.gewertetElo - a.gewertetElo) || (b.elo - a.elo) || a.person.index - b.person.index);
  let r = 0;
  for (const S of A.rangElo) S.rangElo = S.gewertetElo && S.person.aktiv ? ++r : null;
  A.rangTreppchen = teilnehmer.slice().sort((a, b) =>
    (b.person.aktiv - a.person.aktiv) || (b.gesamt.gewertet - a.gesamt.gewertet) || (b.gesamt.treppchenIndex - a.gesamt.treppchenIndex) ||
    (b.gesamt.score - a.gesamt.score) || a.person.index - b.person.index);
  r = 0;
  for (const S of A.rangTreppchen) S.rangTreppchen = S.gesamt.gewertet && S.person.aktiv ? ++r : null;

  // --- Auswertung je Spiel -----------------------------------------------
  for (const spiel of modell.spiele) {
    const partien = imZeitraum.filter((p) => p.spiel === spiel);
    const alle = bisPartien.filter((p) => p.spiel === spiel);
    const G = {
      spiel, partien, alle, anzahl: partien.length,
      erste: partien.length ? partien[0].tag : null,
      letzte: partien.length ? partien[partien.length - 1].tag : null,
      spielerzahlSchnitt: partien.length ? mittel(partien.map((p) => p.n)) : null,
      hatPunkte: partien.some((p) => p.hatPunkte)
    };
    const zeilen = [];
    for (const S of A.spieler.values()) {
      const SG = S.proSpiel.get(spiel.key);
      if (SG && SG.partien > 0) zeilen.push({ S, SG });
    }
    G.zeilen = zeilen;
    G.rangElo = zeilen.slice().sort((a, b) => (b.S.person.aktiv - a.S.person.aktiv) || (b.SG.gewertetElo - a.SG.gewertetElo) || (b.SG.elo - a.SG.elo) || a.S.person.index - b.S.person.index);
    let rr = 0;
    for (const z of G.rangElo) z.rang = z.SG.gewertetElo && z.S.person.aktiv ? ++rr : null;
    G.spitzenreiter = G.rangElo.length && G.rangElo[0].rang === 1 ? G.rangElo[0] : null;
    const nachSiegen = zeilen.slice().sort((a, b) => b.SG.siege - a.SG.siege);
    G.meisteSiege = nachSiegen.length && nachSiegen[0].SG.siege > 0 ? nachSiegen[0] : null;

    // Glück oder Können: Wie oft gewinnt der Favorit?
    const mitFavorit = partien.filter((p) => p.favorit);
    G.planbarkeit = {
      partien: mitFavorit.length,
      siege: mitFavorit.filter((p) => p.favorit.sieg).length,
      zufall: mitFavorit.length ? mittel(mitFavorit.map((p) => 1 / p.n)) : null,
      erwartet: mitFavorit.length ? mittel(mitFavorit.map((p) => p.favorit.chance)) : null
    };
    const pb = G.planbarkeit;
    pb.quote = pb.partien ? pb.siege / pb.partien : null;
    if (pb.partien < MIN_PARTIEN_PLANBARKEIT) pb.urteil = null;
    else if (pb.quote >= pb.zufall + 0.15) pb.urteil = 'koennen';
    else if (pb.quote <= pb.zufall + 0.05) pb.urteil = 'glueck';
    else pb.urteil = 'gemischt';

    // Nach Spielerzahl
    G.nachSpielerzahl = new Map();
    for (const p of partien) {
      const eintrag = G.nachSpielerzahl.get(p.n) || { n: p.n, partien: 0, punkte: [], proSpieler: new Map() };
      eintrag.partien++;
      for (const e of p.ergebnisse) {
        if (e.punkte !== null) eintrag.punkte.push(e.punkte);
        const x = eintrag.proSpieler.get(e.key) || { person: e.person, partien: 0, siege: 0, scores: [], punkte: [] };
        x.partien++;
        if (e.sieg) x.siege++;
        x.scores.push(e.score);
        if (e.punkte !== null) x.punkte.push(e.punkte);
        eintrag.proSpieler.set(e.key, x);
      }
      G.nachSpielerzahl.set(p.n, eintrag);
    }

    // Ausgeglichenheit: Streuung der Spiel-Elo unter den Gewerteten
    const gewertet = G.rangElo.filter((z) => z.SG.gewertetElo).map((z) => z.SG.elo);
    G.ausgeglichenheit = {
      streuung: gewertet.length >= 2 ? stdabw(gewertet) : null,
      verschiedeneSieger: new Set(partien.flatMap((p) => p.gewinner.map((e) => e.key))).size
    };

    // Beliebtheit: Partien je Monat
    G.monate = new Map();
    for (const p of partien) {
      const m = monatsSchluessel(p.tag);
      G.monate.set(m, (G.monate.get(m) || 0) + 1);
    }

    // Rekord (bis zum Stichtag)
    let rekord = null;
    for (const p of alle) for (const e of p.ergebnisse) {
      if (e.punkte !== null && (!rekord || e.punkte > rekord.wert)) rekord = { wert: e.punkte, person: e.person, tag: p.tag, partie: p };
    }
    G.rekord = rekord;

    // Spezialisten: Spiel-Elo im Vergleich zur Gesamt-Elo
    G.spezialisten = G.rangElo.filter((z) => z.SG.gewertetElo && z.S.gewertetElo)
      .map((z) => ({ S: z.S, SG: z.SG, differenz: z.SG.elo - z.S.elo }))
      .sort((a, b) => b.differenz - a.differenz);

    A.spiele.set(spiel.key, G);
  }

  // --- Rangverlauf (Platz in der Gesamt-Elo nach jedem Abend) -------------
  A.rangVerlauf = berechneRangVerlauf(bisPartien, vonTag, new Set(teilnehmer.filter((S) => S.person.aktiv).map((S) => S.key)));

  // --- Spieler des Quartals (unabhängig vom Anfang des Zeitraums) ----------
  A.quartale = berechneQuartale(bisPartien, bisTag);

  // --- Erfolge -----------------------------------------------------------
  A.erfolge = berechneErfolge(modell, bisPartien, A.quartale);

  modell._cache.set(schluessel, A);
  return A;
}

/** Platz in der Gesamt-Elo nach jedem Spieleabend (bei vielen Abenden monatlich) */
function berechneRangVerlauf(bisPartien, vonTag, teilnehmerKeys) {
  const elo = new Map();
  const anzahl = new Map();
  const schnappschuesse = [];
  const abendEnden = [];
  for (let i = 0; i < bisPartien.length; i++) {
    const p = bisPartien[i];
    for (const e of p.ergebnisse) { elo.set(e.key, e.eloNach); anzahl.set(e.key, e.nrGesamt); }
    const naechste = bisPartien[i + 1];
    if (!naechste || naechste.tag !== p.tag) {
      if (p.tag >= vonTag) {
        const rangliste = [...teilnehmerKeys].filter((k) => (anzahl.get(k) || 0) >= MIN_PARTIEN)
          .sort((a, b) => elo.get(b) - elo.get(a));
        const plaetze = new Map(rangliste.map((k, idx) => [k, idx + 1]));
        schnappschuesse.push({ tag: p.tag, plaetze, elo: new Map(rangliste.map((k) => [k, elo.get(k)])) });
      }
      abendEnden.push(p.tag);
    }
  }
  let punkte = schnappschuesse;
  let modus = 'abend';
  if (schnappschuesse.length > 40) {
    // Monatlich verdichten: letzter Abend jedes Monats
    const jeMonat = new Map();
    for (const snap of schnappschuesse) jeMonat.set(monatsSchluessel(snap.tag), snap);
    punkte = [...jeMonat.values()];
    modus = 'monat';
  }
  return { punkte, modus };
}

/** Spieler des Quartals: mindestens die Hälfte der Partien dabei, dann bester Treppchen-Index */
function berechneQuartale(bisPartien, bisTag) {
  const gruppen = new Map();
  for (const p of bisPartien) {
    const k = quartalsSchluessel(p.tag);
    if (!gruppen.has(k)) gruppen.set(k, []);
    gruppen.get(k).push(p);
  }
  const bezug = isFinite(bisTag) ? Math.min(bisTag, heuteTag()) : heuteTag();
  const ergebnis = [];
  for (const [k, partien] of gruppen) {
    const { jahr, q } = quartalAusSchluessel(k);
    const gesamt = partien.length;
    const jeSpieler = new Map();
    for (const p of partien) for (const e of p.ergebnisse) {
      const x = jeSpieler.get(e.key) || { person: e.person, partien: 0, quoteSumme: 0, scoreSumme: 0, siege: 0 };
      x.partien++;
      x.quoteSumme += e.treppchenQuote;
      x.scoreSumme += e.score;
      if (e.sieg) x.siege++;
      jeSpieler.set(e.key, x);
    }
    const noetig = Math.max(QUARTAL_MIN_PARTIEN, gesamt * QUARTAL_TEILNAHME);
    const kandidaten = [...jeSpieler.values()].map((x) => ({
      person: x.person, partien: x.partien,
      index: (x.quoteSumme / x.partien) * 100,
      score: x.scoreSumme / x.partien,
      siegquote: x.siege / x.partien,
      berechtigt: x.partien >= noetig - 1e-9
    })).sort((a, b) => (b.berechtigt - a.berechtigt) || (b.index - a.index) || (b.score - a.score) || (b.siegquote - a.siegquote));
    const sieger = kandidaten.length && kandidaten[0].berechtigt ? kandidaten[0] : null;
    ergebnis.push({
      schluessel: k, jahr, q, gesamt, noetig: Math.ceil(noetig - 1e-9), kandidaten, sieger,
      laufend: quartalEnde(jahr, q) >= bezug
    });
  }
  return ergebnis.sort((a, b) => b.schluessel - a.schluessel);
}

const ERFOLGE = [
  { id: 'ersterSieg', name: 'Erster Sieg', symbol: 'stern', text: 'Die erste gewonnene Partie.' },
  { id: 'hattrick', name: 'Hattrick', symbol: 'flamme', text: 'Drei eigene Partien in Folge gewonnen.' },
  { id: 'serie', name: 'Siegesserie', symbol: 'blitz', text: 'Fünf eigene Partien in Folge gewonnen.' },
  { id: 'comeback', name: 'Comeback', symbol: 'trend', text: 'Sieg nach mindestens fünf Partien ohne Sieg.' },
  { id: 'ueberraschung', name: 'Überraschungssieg', symbol: 'wuerfel', text: 'Gewonnen, obwohl die Siegchance vorher unter 20 % lag.' },
  { id: 'treppchenAbo', name: 'Treppchen-Abo', symbol: 'treppchen', text: 'Fünf eigene Partien in Folge mit Treppchen-Punkten.' },
  { id: 'perfekterAbend', name: 'Perfekter Abend', symbol: 'mond', text: 'Alle eigenen Partien eines Abends gewonnen, mindestens zwei.' },
  { id: 'spezialist', name: 'Spezialist', symbol: 'krone', text: 'Platz 1 in der Elo-Rangliste eines Spiels.' },
  { id: 'doppelspitze', name: 'Doppelspitze', symbol: 'medaille', text: 'Gleichzeitig Platz 1 in zwei Spielen.' },
  { id: 'rekord', name: 'Rekordhalter', symbol: 'rueckblick', text: 'Neue Bestpunktzahl in einem Spiel aufgestellt.' },
  { id: 'allrounder', name: 'Allrounder', symbol: 'kompass', text: 'Jedes aktive Spiel mindestens einmal gewonnen.' },
  { id: 'quartal', name: 'Spieler des Quartals', symbol: 'pokal', text: 'Einmal Spieler des Quartals geworden.' }
];

/** Erfolge je Spieler: Map key -> Map erfolgId -> { tag, partie } */
function berechneErfolge(modell, bisPartien, quartale) {
  const erfolge = new Map(modell.spieler.map((sp) => [sp.key, new Map()]));
  const freischalten = (key, id, tag, partie) => {
    const m = erfolge.get(key);
    if (m && !m.has(id)) m.set(id, { tag, partie: partie || null });
  };
  const serien = new Map();
  const zustand = (key) => {
    if (!serien.has(key)) serien.set(key, { sieg: 0, ohne: 0, treppchen: 0 });
    return serien.get(key);
  };
  const spielElo = new Map();
  const spielAnzahl = new Map();
  const anfuehrer = new Map();
  const rekorde = new Map();
  const ersteSiegeJeSpiel = new Map();

  for (let i = 0; i < bisPartien.length; i++) {
    const p = bisPartien[i];
    const pool = spielElo.get(p.spiel.key) || new Map();
    spielElo.set(p.spiel.key, pool);
    const zaehl = spielAnzahl.get(p.spiel.key) || new Map();
    spielAnzahl.set(p.spiel.key, zaehl);
    const rek = rekorde.get(p.spiel.key) || { wert: null, anzahl: 0 };
    rekorde.set(p.spiel.key, rek);

    let neuerRekord = null;
    for (const e of p.ergebnisse) {
      const z = zustand(e.key);
      if (e.sieg) {
        freischalten(e.key, 'ersterSieg', p.tag, p);
        if (z.ohne >= 5) freischalten(e.key, 'comeback', p.tag, p);
        z.sieg++; z.ohne = 0;
        if (z.sieg >= 3) freischalten(e.key, 'hattrick', p.tag, p);
        if (z.sieg >= 5) freischalten(e.key, 'serie', p.tag, p);
        if (e.chance < 0.2 && e.chance < 0.75 / p.n) freischalten(e.key, 'ueberraschung', p.tag, p);
        const erste = ersteSiegeJeSpiel.get(e.key) || new Map();
        if (!erste.has(p.spiel.key)) erste.set(p.spiel.key, p.tag);
        ersteSiegeJeSpiel.set(e.key, erste);
      } else {
        z.ohne++; z.sieg = 0;
      }
      if (e.treppchen > 0) { z.treppchen++; if (z.treppchen >= 5) freischalten(e.key, 'treppchenAbo', p.tag, p); } else z.treppchen = 0;
      pool.set(e.key, e.spielEloNach);
      zaehl.set(e.key, e.nrSpiel);
      if (e.punkte !== null && rek.anzahl >= 3 && rek.wert !== null && e.punkte > rek.wert) {
        if (!neuerRekord || e.punkte > neuerRekord.punkte) neuerRekord = e;
      }
    }
    if (neuerRekord) freischalten(neuerRekord.key, 'rekord', p.tag, p);
    const mitPunkten = p.ergebnisse.filter((e) => e.punkte !== null);
    if (mitPunkten.length) {
      rek.anzahl++;
      const max = Math.max(...mitPunkten.map((e) => e.punkte));
      rek.wert = rek.wert === null ? max : Math.max(rek.wert, max);
    }
    // Anführer dieses Spiels nach der Partie
    let fuehrend = null, besteElo = -Infinity;
    for (const [k, wert] of pool) {
      if ((zaehl.get(k) || 0) >= MIN_PARTIEN && wert > besteElo) { besteElo = wert; fuehrend = k; }
    }
    if (fuehrend) {
      anfuehrer.set(p.spiel.key, fuehrend);
      freischalten(fuehrend, 'spezialist', p.tag, p);
      let spitzen = 0;
      for (const k of anfuehrer.values()) if (k === fuehrend) spitzen++;
      if (spitzen >= 2) freischalten(fuehrend, 'doppelspitze', p.tag, p);
    }
    // Perfekter Abend: am Ende eines Abends prüfen
    const naechste = bisPartien[i + 1];
    if (!naechste || naechste.tag !== p.tag) {
      const abendPartien = [];
      for (let j = i; j >= 0 && bisPartien[j].tag === p.tag; j--) abendPartien.push(bisPartien[j]);
      const bilanz = new Map();
      for (const ap of abendPartien) for (const e of ap.ergebnisse) {
        const b = bilanz.get(e.key) || { gespielt: 0, gewonnen: 0 };
        b.gespielt++;
        if (e.sieg) b.gewonnen++;
        bilanz.set(e.key, b);
      }
      for (const [k, b] of bilanz) if (b.gespielt >= 2 && b.gewonnen === b.gespielt) freischalten(k, 'perfekterAbend', p.tag, p);
    }
  }

  // Allrounder: jedes aktive, schon gespielte Spiel mindestens einmal gewonnen
  const pflichtSpiele = modell.spiele.filter((sp) => sp.aktiv && bisPartien.some((p) => p.spiel === sp));
  if (pflichtSpiele.length >= 2) {
    for (const [key, erste] of ersteSiegeJeSpiel) {
      if (pflichtSpiele.every((sp) => erste.has(sp.key))) {
        freischalten(key, 'allrounder', Math.max(...pflichtSpiele.map((sp) => erste.get(sp.key))), null);
      }
    }
  }
  // Spieler des Quartals (nur abgeschlossene Quartale)
  for (const q of quartale.slice().reverse()) {
    if (!q.laufend && q.sieger) freischalten(q.sieger.person.key, 'quartal', quartalEnde(q.jahr, q.q), null);
  }
  // Fortschritt für den Allrounder
  const fortschritt = new Map();
  for (const sp of modell.spieler) {
    const erste = ersteSiegeJeSpiel.get(sp.key) || new Map();
    fortschritt.set(sp.key, { allrounder: { erreicht: pflichtSpiele.filter((g) => erste.has(g.key)).length, noetig: pflichtSpiele.length } });
  }
  return { jeSpieler: erfolge, fortschritt };
}

// ---- 07-diagramme.js ----
// ===========================================================================
// Diagramm-Baukasten (eigenes SVG/HTML, keine Bibliotheken)
// Regeln: dünne Linien (2px), Balken höchstens 24px mit 4px runden Enden,
// Haarlinien-Gitter, Legende ab zwei Reihen, Tooltip bei jeder Grafik,
// Texte in Textfarben (nie in Datenfarben), Tabellenansicht als Alternative.
// ===========================================================================

let tooltipEl = null;
let tooltipBesitzer = null;

function holeTooltip() {
  if (!tooltipEl) {
    tooltipEl = h('div', { class: 'tooltip', role: 'status', 'aria-live': 'polite' });
    document.body.appendChild(tooltipEl);
    document.addEventListener('pointerdown', (ev) => {
      if (tooltipBesitzer && !tooltipBesitzer.contains(ev.target)) versteckeTooltip();
    }, true);
    window.addEventListener('scroll', () => versteckeTooltip(), { passive: true });
  }
  return tooltipEl;
}

function zeigeTooltip(clientX, clientY, kinder, besitzer) {
  const el = holeTooltip();
  tooltipBesitzer = besitzer || null;
  ersetzeInhalt(el, kinder);
  el.classList.add('sichtbar');
  const rechteck = el.getBoundingClientRect();
  const bw = window.innerWidth, bh = window.innerHeight;
  let x = clientX + 14;
  let y = clientY - rechteck.height - 14;
  if (x + rechteck.width > bw - 8) x = clientX - rechteck.width - 14;
  if (x < 8) x = Math.max(8, Math.min(bw - rechteck.width - 8, clientX - rechteck.width / 2));
  if (y < 8) y = clientY + 18;
  if (y + rechteck.height > bh - 8) y = bh - rechteck.height - 8;
  el.style.left = Math.round(x) + 'px';
  el.style.top = Math.round(y) + 'px';
}

function versteckeTooltip() {
  if (tooltipEl) tooltipEl.classList.remove('sichtbar');
  tooltipBesitzer = null;
}

const ttTitel = (text) => h('div', { class: 'tt-titel' }, text);
function ttZeile(farbe, wert, name, zusatz, flaeche) {
  return h('div', { class: 'tt-zeile' },
    farbe ? h('span', { class: flaeche ? 'schluessel-flaeche' : 'schluessel-linie', style: { '--farbe': farbe } }) : null,
    h('span', { class: 'tt-wert' }, wert),
    name ? h('span', { class: 'tt-name' }, name) : null,
    zusatz ? h('span', { class: 'tt-zusatz' }, zusatz) : null);
}

/**
 * Behälter, der beim ersten Sichtbarwerden und bei Größenänderung neu zeichnet.
 * zeichne(el, breite, animieren)
 */
function diagrammBehaelter(zeichne, klasse = '') {
  const el = h('div', { class: ('diagramm ' + klasse).trim() });
  let erste = true;
  let letzteBreite = 0;
  const neu = () => {
    const breite = Math.floor(el.clientWidth);
    if (!breite || breite === letzteBreite) return;
    letzteBreite = breite;
    leeren(el);
    zeichne(el, breite, erste && !bewegungReduziert());
    erste = false;
  };
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => requestAnimationFrame(neu));
    ro.observe(el);
  } else {
    window.addEventListener('resize', entprellen(neu, 120));
  }
  requestAnimationFrame(neu);
  el.neuZeichnen = () => { letzteBreite = 0; neu(); };
  return el;
}

function skalaLinear(d0, d1, r0, r1) {
  const span = d1 - d0 || 1;
  const f = (v) => r0 + ((v - d0) / span) * (r1 - r0);
  f.umkehren = (px) => d0 + ((px - r0) / (r1 - r0)) * span;
  return f;
}

function textBreite(text, groesse = 11) { return String(text).length * groesse * 0.58; }

/** Achsenbeschriftung für Tage: Monats- oder Tagesmarken */
function datumsTicks(min, max, maxAnzahl) {
  const spanne = max - min;
  if (spanne <= 0) return [{ wert: min, text: fmtDatumKurz(min) }];
  if (spanne <= 45) {
    const schritt = Math.max(1, Math.ceil(spanne / Math.max(1, maxAnzahl - 1)));
    const ticks = [];
    for (let t = min; t <= max; t += schritt) ticks.push({ wert: t, text: fmtDatumKurz(t) });
    return ticks;
  }
  const monate = [1, 2, 3, 4, 6, 12, 24];
  const startM = monatsSchluessel(min) + 1;
  const endeM = monatsSchluessel(max);
  for (const schritt of monate) {
    const ticks = [];
    for (let m = startM; m <= endeM; m++) {
      if ((m % 12) % schritt !== 0 && schritt < 12) continue;
      if (schritt >= 12 && m % 12 !== 0) continue;
      const { jahr, monat } = monatAusSchluessel(m);
      const tag = tagAusTeilen(jahr, monat, 1);
      ticks.push({ wert: tag, text: monat === 1 || schritt >= 12 ? String(jahr) : MONATE_KURZ[monat - 1] });
    }
    if (ticks.length <= maxAnzahl) return ticks.length ? ticks : [{ wert: min, text: fmtMonatJahr(min) }];
  }
  return [{ wert: min, text: fmtMonatJahr(min) }, { wert: max, text: fmtMonatJahr(max) }];
}

/** Legende mit Umschaltern (an/aus) und Hervorheben beim Überfahren */
function legendeMitSchaltern(reihen, sichtbar, beiAenderung, beiHervorheben) {
  const box = h('div', { class: 'legende', role: 'group', 'aria-label': 'Reihen ein- und ausblenden' });
  for (const r of reihen) {
    const knopf = h('button', {
      type: 'button', 'aria-pressed': sichtbar.has(r.id) ? 'true' : 'false',
      title: 'Ein- oder ausblenden',
      onclick: () => {
        if (sichtbar.has(r.id)) { if (sichtbar.size > 1) sichtbar.delete(r.id); } else sichtbar.add(r.id);
        for (const k of box.querySelectorAll('button[data-id]')) k.setAttribute('aria-pressed', sichtbar.has(k.dataset.id) ? 'true' : 'false');
        beiAenderung();
      },
      onpointerenter: () => beiHervorheben && beiHervorheben(r.id),
      onpointerleave: () => beiHervorheben && beiHervorheben(null),
      dataset: { id: r.id }
    }, h('span', { class: r.flaeche ? 'schluessel-flaeche' : 'schluessel-linie', style: { '--farbe': r.farbe } }), r.name);
    box.appendChild(knopf);
  }
  if (reihen.length > 2) {
    box.appendChild(h('button', {
      type: 'button', class: 'alle', onclick: () => {
        reihen.forEach((r) => sichtbar.add(r.id));
        for (const k of box.querySelectorAll('button[data-id]')) k.setAttribute('aria-pressed', 'true');
        beiAenderung();
      }
    }, 'Alle'));
  }
  return box;
}

// ---------------------------------------------------------------------------
// Liniendiagramm (z. B. Elo-Verlauf)
// ---------------------------------------------------------------------------

/**
 * reihen: [{ id, name, farbe, punkte: [{ x, y, zusatz }] }]
 * optionen: { xTyp: 'datum'|'index', yFormat, hoehe, bezug, xName, startWert }
 */
function linienDiagramm(reihen, optionen = {}) {
  const o = Object.assign({ xTyp: 'datum', yFormat: fmtElo, hoehe: 250, bezug: null, xName: (x) => (o.xTyp === 'datum' ? fmtDatum(x) : 'Partie ' + x) }, optionen);
  const sichtbar = new Set(reihen.map((r) => r.id));
  const wrap = h('div', { class: 'stapel eng' });
  let hervorgehoben = null;
  let behaelter;
  const zeichneNeu = () => behaelter.neuZeichnen();
  if (reihen.length > 1) wrap.appendChild(legendeMitSchaltern(reihen, sichtbar, zeichneNeu, (id) => { hervorgehoben = id; aktualisiereHervorhebung(); }));
  const pfade = new Map();
  const aktualisiereHervorhebung = () => {
    for (const [id, gruppe] of pfade) gruppe.classList.toggle('gedimmt', !!hervorgehoben && hervorgehoben !== id);
  };

  behaelter = diagrammBehaelter((el, breite, animieren) => {
    pfade.clear();
    const aktive = reihen.filter((r) => sichtbar.has(r.id) && r.punkte.length);
    const hoehe = o.hoehe;
    const alleX = [], alleY = [];
    for (const r of aktive) for (const p of r.punkte) { alleX.push(p.x); alleY.push(p.y); }
    if (!alleX.length) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Keine Daten im gewählten Zeitraum.')); return; }
    let yMin = Math.min(...alleY), yMax = Math.max(...alleY);
    if (o.bezug !== null) { yMin = Math.min(yMin, o.bezug); yMax = Math.max(yMax, o.bezug); }
    const pad = Math.max((yMax - yMin) * 0.08, 4);
    const d0 = yMin - pad, d1 = yMax + pad;
    let ticksY = schoeneTicks(d0, d1, 5).filter((t) => t >= d0 && t <= d1);
    if (ticksY.length < 2) ticksY = schoeneTicks(d0, d1, 5);
    const yUnten = Math.min(d0, ticksY[0]), yOben = Math.max(d1, ticksY[ticksY.length - 1]);
    const xMin = Math.min(...alleX), xMax = Math.max(...alleX);
    const endLabels = aktive.length <= 4;
    const links = Math.max(34, textBreite(o.yFormat(ticksY[ticksY.length - 1])) + 10);
    const rechts = endLabels ? 46 : 14;
    const oben = 8, unten = 24;
    const sx = skalaLinear(xMin, xMax === xMin ? xMin + 1 : xMax, links, breite - rechts);
    const sy = skalaLinear(yUnten, yOben, hoehe - unten, oben);
    const svg = s('svg', { width: breite, height: hoehe, viewBox: '0 0 ' + breite + ' ' + hoehe, role: 'img', 'aria-label': 'Verlaufsdiagramm' });
    for (const t of ticksY) {
      svg.appendChild(s('line', { class: 'gitter', x1: links, x2: breite - rechts, y1: sy(t), y2: sy(t) }));
      svg.appendChild(s('text', { x: links - 8, y: sy(t) + 4, 'text-anchor': 'end' }, o.yFormat(t)));
    }
    if (o.bezug !== null) svg.appendChild(s('line', { class: 'bezug', x1: links, x2: breite - rechts, y1: sy(o.bezug), y2: sy(o.bezug) }));
    const maxTicks = Math.max(2, Math.floor((breite - links - rechts) / 70));
    const ticksX = o.xTyp === 'datum' ? datumsTicks(xMin, xMax, maxTicks)
      : schoeneTicks(xMin, xMax, maxTicks).filter((t) => t >= xMin && t <= xMax && Number.isInteger(t)).map((t) => ({ wert: t, text: fmtZahl(t) }));
    for (const t of ticksX) {
      if (t.wert < xMin || t.wert > xMax) continue;
      svg.appendChild(s('text', { x: sx(t.wert), y: hoehe - 6, 'text-anchor': 'middle' }, t.text));
    }
    svg.appendChild(s('line', { class: 'achse', x1: links, x2: breite - rechts, y1: hoehe - unten + 0.5, y2: hoehe - unten + 0.5 }));

    const labelPos = [];
    for (const r of aktive) {
      const gruppe = s('g', {});
      const d = r.punkte.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join('');
      const pfad = s('path', { class: 'linie', d, stroke: r.farbe });
      gruppe.appendChild(pfad);
      const letzter = r.punkte[r.punkte.length - 1];
      gruppe.appendChild(s('circle', { cx: sx(letzter.x), cy: sy(letzter.y), r: 4.5, fill: r.farbe, stroke: 'var(--flaeche)', 'stroke-width': 2 }));
      svg.appendChild(gruppe);
      pfade.set(r.id, gruppe);
      if (animieren) {
        requestAnimationFrame(() => {
          try {
            const laenge = Math.ceil(pfad.getTotalLength()) + 2;
            pfad.style.setProperty('--laenge', laenge);
            pfad.classList.add('zeichnen');
          } catch (e) { /* ohne Animation */ }
        });
      }
      if (endLabels) labelPos.push({ y: sy(letzter.y), x: sx(letzter.x), text: r.name });
    }
    // Endbeschriftungen nur, wenn sie sich nicht überlappen
    if (endLabels) {
      labelPos.sort((a, b) => a.y - b.y);
      const kollision = labelPos.some((l, i) => i > 0 && l.y - labelPos[i - 1].y < 13);
      if (!kollision) for (const l of labelPos) svg.appendChild(s('text', { class: 'beschriftung', x: l.x + 8, y: l.y + 4 }, l.text));
    }
    aktualisiereHervorhebung();

    // Interaktion: Fadenkreuz rastet am nächsten Datenpunkt ein
    const xWerte = [...new Set(alleX)].sort((a, b) => a - b);
    const kreuz = s('line', { class: 'fadenkreuz', y1: oben, y2: hoehe - unten, x1: -10, x2: -10, visibility: 'hidden' });
    const marker = s('g', {});
    svg.appendChild(kreuz);
    svg.appendChild(marker);
    const flaeche = s('rect', { class: 'treffer', x: links, y: 0, width: Math.max(1, breite - links - rechts + 8), height: hoehe - unten });
    svg.appendChild(flaeche);
    const wertBei = (r, x) => {
      let treffer = null;
      for (const p of r.punkte) { if (p.x <= x) treffer = p; else break; }
      return treffer;
    };
    const zeige = (ev) => {
      const box = svg.getBoundingClientRect();
      const px = ev.clientX - box.left;
      const ziel = sx.umkehren(px);
      let naechster = xWerte[0];
      for (const x of xWerte) if (Math.abs(x - ziel) < Math.abs(naechster - ziel)) naechster = x;
      kreuz.setAttribute('x1', sx(naechster));
      kreuz.setAttribute('x2', sx(naechster));
      kreuz.setAttribute('visibility', 'visible');
      leeren(marker);
      const zeilen = [];
      const liste = aktive.map((r) => ({ r, p: wertBei(r, naechster) })).filter((z) => z.p).sort((a, b) => b.p.y - a.p.y);
      for (const { r, p } of liste) {
        const genau = p.x === naechster;
        if (genau) marker.appendChild(s('circle', { cx: sx(p.x), cy: sy(p.y), r: 4, fill: r.farbe, stroke: 'var(--flaeche)', 'stroke-width': 2 }));
        zeilen.push(ttZeile(r.farbe, o.yFormat(p.y), r.name, genau && p.zusatz ? p.zusatz : ''));
      }
      zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(o.xName(naechster)), zeilen], el);
    };
    flaeche.addEventListener('pointermove', zeige);
    flaeche.addEventListener('pointerdown', zeige);
    flaeche.addEventListener('pointerleave', (ev) => {
      if (ev.pointerType === 'mouse') { versteckeTooltip(); kreuz.setAttribute('visibility', 'hidden'); leeren(marker); }
    });
    el.appendChild(svg);
  });
  wrap.appendChild(behaelter);
  return wrap;
}

// ---------------------------------------------------------------------------
// Rangverlauf (Bump-Chart)
// ---------------------------------------------------------------------------

function bumpDiagramm(verlauf, personen, optionen = {}) {
  const punkte = verlauf.punkte;
  const reihen = personen.map((p) => ({ id: p.key, name: p.kuerzel, farbe: p.farbe, person: p }))
    .filter((r) => punkte.some((snap) => snap.plaetze.has(r.id)));
  const sichtbar = new Set(reihen.map((r) => r.id));
  const wrap = h('div', { class: 'stapel eng' });
  let hervor = null;
  const gruppen = new Map();
  const hervorheben = () => { for (const [id, g] of gruppen) g.classList.toggle('gedimmt', !!hervor && hervor !== id); };
  let behaelter;
  if (reihen.length > 1) wrap.appendChild(legendeMitSchaltern(reihen, sichtbar, () => behaelter.neuZeichnen(), (id) => { hervor = id; hervorheben(); }));
  behaelter = diagrammBehaelter((el, breite, animieren) => {
    gruppen.clear();
    if (punkte.length < 2 || !reihen.length) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Noch zu wenige Abende mit gewerteten Spielern für einen Verlauf.')); return; }
    let maxRang = 1;
    for (const snap of punkte) for (const [k, r] of snap.plaetze) if (sichtbar.has(k)) maxRang = Math.max(maxRang, r);
    const hoehe = Math.max(180, 40 + maxRang * 34);
    const links = 40, rechts = 40, oben = 14, unten = 26;
    const sx = skalaLinear(0, punkte.length - 1, links, breite - rechts);
    const sy = skalaLinear(1, Math.max(2, maxRang), oben, hoehe - unten);
    const svg = s('svg', { width: breite, height: hoehe, viewBox: '0 0 ' + breite + ' ' + hoehe, role: 'img', 'aria-label': 'Rangverlauf' });
    for (let r = 1; r <= maxRang; r++) {
      svg.appendChild(s('line', { class: 'gitter', x1: links, x2: breite - rechts, y1: sy(r), y2: sy(r) }));
      svg.appendChild(s('text', { x: 8, y: sy(r) + 4 }, r + '.'));
    }
    const maxTicks = Math.max(2, Math.floor((breite - links - rechts) / 70));
    const schritt = Math.max(1, Math.ceil(punkte.length / maxTicks));
    for (let i = 0; i < punkte.length; i += schritt) {
      svg.appendChild(s('text', { x: sx(i), y: hoehe - 6, 'text-anchor': 'middle' }, verlauf.modus === 'monat' ? fmtMonatJahr(punkte[i].tag).replace(' 20', ' ') : fmtDatumKurz(punkte[i].tag)));
    }
    for (const r of reihen) {
      if (!sichtbar.has(r.id)) continue;
      const g = s('g', {});
      let d = '';
      let vorher = false;
      punkte.forEach((snap, i) => {
        const rang = snap.plaetze.get(r.id);
        if (rang === undefined) { vorher = false; return; }
        d += (vorher ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(rang).toFixed(1);
        vorher = true;
      });
      const pfad = s('path', { class: 'linie', d, stroke: r.farbe });
      g.appendChild(pfad);
      const punktRadius = punkte.length > 18 ? 0 : 4.5;
      let letzterIndex = -1;
      punkte.forEach((snap, i) => { if (snap.plaetze.get(r.id) !== undefined) letzterIndex = i; });
      punkte.forEach((snap, i) => {
        const rang = snap.plaetze.get(r.id);
        if (rang === undefined) return;
        if (punktRadius || i === letzterIndex) g.appendChild(s('circle', { cx: sx(i), cy: sy(rang), r: punktRadius || 4.5, fill: r.farbe, stroke: 'var(--flaeche)', 'stroke-width': 2 }));
        const treffer = s('circle', { class: 'treffer', cx: sx(i), cy: sy(rang), r: 12 });
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [
          ttTitel((verlauf.modus === 'monat' ? 'Ende ' + fmtMonatJahr(snap.tag) : fmtDatum(snap.tag))),
          ttZeile(r.farbe, rang + '. Platz', r.name, 'Elo ' + fmtElo(snap.elo.get(r.id)))
        ], el);
        treffer.addEventListener('pointermove', zeige);
        treffer.addEventListener('pointerdown', zeige);
        treffer.addEventListener('pointerenter', () => { hervor = r.id; hervorheben(); });
        treffer.addEventListener('pointerleave', (ev) => { hervor = null; hervorheben(); if (ev.pointerType === 'mouse') versteckeTooltip(); });
        g.appendChild(treffer);
      });
      // Beschriftung rechts am letzten Punkt
      for (let i = punkte.length - 1; i >= 0; i--) {
        const rang = punkte[i].plaetze.get(r.id);
        if (rang !== undefined) { g.appendChild(s('text', { class: 'beschriftung', x: sx(i) + 9, y: sy(rang) + 4 }, r.name)); break; }
      }
      if (animieren) {
        requestAnimationFrame(() => {
          try { pfad.style.setProperty('--laenge', Math.ceil(pfad.getTotalLength()) + 2); pfad.classList.add('zeichnen'); } catch (e) { /* egal */ }
        });
      }
      svg.appendChild(g);
      gruppen.set(r.id, g);
    }
    hervorheben();
    el.appendChild(svg);
  });
  wrap.appendChild(behaelter);
  return wrap;
}

// ---------------------------------------------------------------------------
// Balkenliste (HTML), optional mit Bezugslinie oder divergierend
// ---------------------------------------------------------------------------

/**
 * zeilen: [{ label: Node|Text, wert, text, farbe, tooltip }]
 * optionen: { max, min, bezug, divergierend, format }
 */
function balkenListe(zeilen, optionen = {}) {
  const o = Object.assign({ format: (v) => fmtKurz(v), farbe: 'linear-gradient(90deg, #b8842c, #f3c35b)' }, optionen);
  const box = h('div', { class: 'balken-liste', style: { '--label-breite': o.labelBreite || '96px' } });
  if (!zeilen.length) { box.appendChild(h('p', { class: 'text-3 klein' }, 'Keine Daten im gewählten Zeitraum.')); return box; }
  const werte = zeilen.map((z) => z.wert).filter((v) => v !== null && isFinite(v));
  const bezug = o.bezug === undefined || o.bezug === null ? 0 : o.bezug;
  const max = o.max !== undefined ? o.max : Math.max(bezug, ...werte);
  const min = o.min !== undefined ? o.min : (o.divergierend ? Math.min(bezug, ...werte) : 0);
  const spanne = max - min || 1;
  const pos = (v) => ((v - min) / spanne) * 100;
  const animieren = !bewegungReduziert();
  zeilen.forEach((z, i) => {
    const hatWert = z.wert !== null && isFinite(z.wert);
    const von = o.divergierend ? pos(Math.min(bezug, z.wert)) : 0;
    const bis = hatWert ? pos(o.divergierend ? Math.max(bezug, z.wert) : z.wert) : 0;
    const negativ = o.divergierend && z.wert < bezug;
    const balken = h('div', {
      class: 'balken' + (animieren ? ' balken-an' : ''),
      style: {
        left: von + '%', width: Math.max(hatWert ? 0.8 : 0, bis - von) + '%',
        background: z.farbe || (negativ ? 'linear-gradient(270deg, #c85a5a, #e66767)' : o.farbe),
        borderRadius: negativ ? '4px 0 0 4px' : '0 4px 4px 0',
        transformOrigin: negativ ? 'right center' : 'left center',
        animationDelay: (i * 40) + 'ms'
      }
    });
    const spur = h('div', { class: 'balken-spur' }, balken);
    if (o.bezug !== undefined && o.bezug !== null) spur.appendChild(h('div', { class: 'balken-bezug', style: { left: pos(bezug) + '%' } }));
    const zeile = h('div', { class: 'balken-zeile', tabindex: z.tooltip ? '0' : null },
      h('div', { class: 'balken-label' }, z.label),
      spur,
      h('div', { class: 'balken-wert' + (negativ ? ' schlecht' : '') }, hatWert ? (z.text !== undefined ? z.text : o.format(z.wert)) : '–'));
    if (z.tooltip) {
      const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, z.tooltip(), zeile);
      zeile.addEventListener('pointermove', zeige);
      zeile.addEventListener('pointerdown', zeige);
      zeile.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
    }
    box.appendChild(zeile);
  });
  return box;
}

// ---------------------------------------------------------------------------
// Gestapelter 100-%-Balken (z. B. Platzverteilung)
// ---------------------------------------------------------------------------

/** zeilen: [{ label, teile: [{ wert, farbe, name }] }], legende: [{ name, farbe }] */
function gestapelteBalken(zeilen, legende, optionen = {}) {
  const box = h('div', { class: 'stapel eng' });
  if (legende && legende.length) {
    box.appendChild(h('div', { class: 'legende' }, legende.map((l) => h('span', { class: 'legende-eintrag' }, h('span', { class: 'schluessel-flaeche', style: { '--farbe': l.farbe } }), l.name))));
  }
  const liste = h('div', { class: 'balken-liste', style: { '--label-breite': optionen.labelBreite || '96px' } });
  for (const z of zeilen) {
    const gesamt = summe(z.teile.map((t) => t.wert));
    const spur = h('div', { class: 'stapel-spur' });
    if (gesamt > 0) {
      z.teile.forEach((t) => {
        if (!t.wert) return;
        const anteil = t.wert / gesamt;
        const seg = h('div', { class: 'stapel-teil', style: { flexGrow: String(t.wert), background: t.farbe } });
        const text = fmtProzent(anteil);
        seg.dataset.text = text;
        seg.style.setProperty('--auf', textFarbeAuf(t.farbe));
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(typeof z.label === 'string' ? z.label : (z.name || '')), ttZeile(t.farbe, text, t.name, mehrzahl(t.wert, 'Partie', 'Partien'), true)], seg);
        seg.addEventListener('pointermove', zeige);
        seg.addEventListener('pointerdown', zeige);
        seg.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
        spur.appendChild(seg);
      });
    }
    liste.appendChild(h('div', { class: 'balken-zeile' }, h('div', { class: 'balken-label' }, z.label), spur, h('div', { class: 'balken-wert text-3' }, optionen.rechts ? optionen.rechts(z) : '')));
  }
  box.appendChild(liste);
  // Beschriftung nur, wenn sie in das Segment passt
  requestAnimationFrame(() => {
    for (const seg of liste.querySelectorAll('.stapel-teil')) {
      if (seg.getBoundingClientRect().width >= 38) seg.textContent = seg.dataset.text;
    }
  });
  return box;
}

// ---------------------------------------------------------------------------
// Gestapelte Säulen (z. B. Partien je Monat und Spiel)
// ---------------------------------------------------------------------------

/** kategorien: [{ schluessel, text, titel }], reihen: [{ id, name, farbe, werte: Map(schluessel -> zahl) }] */
function gestapelteSaeulen(kategorien, reihen, optionen = {}) {
  const sichtbar = new Set(reihen.map((r) => r.id));
  const wrap = h('div', { class: 'stapel eng' });
  let behaelter;
  if (reihen.length > 1) wrap.appendChild(legendeMitSchaltern(reihen.map((r) => Object.assign({ flaeche: true }, r)), sichtbar, () => behaelter.neuZeichnen()));
  behaelter = diagrammBehaelter((el, breite, animieren) => {
    const hoehe = optionen.hoehe || 200;
    const summen = kategorien.map((k) => summe(reihen.filter((r) => sichtbar.has(r.id)).map((r) => r.werte.get(k.schluessel) || 0)));
    const ticksY = schoeneTicks(0, Math.max(1, ...summen), 4).filter((t) => Number.isInteger(t));
    const links = 30, rechts = 6, oben = 8, unten = 24;
    const sy = skalaLinear(0, ticksY[ticksY.length - 1], hoehe - unten, oben);
    const band = (breite - links - rechts) / Math.max(1, kategorien.length);
    const bw = Math.min(24, Math.max(3, band * 0.62));
    const svg = s('svg', { width: breite, height: hoehe, viewBox: '0 0 ' + breite + ' ' + hoehe, role: 'img', 'aria-label': optionen.titel || 'Säulendiagramm' });
    for (const t of ticksY) {
      svg.appendChild(s('line', { class: 'gitter', x1: links, x2: breite - rechts, y1: sy(t), y2: sy(t) }));
      svg.appendChild(s('text', { x: links - 6, y: sy(t) + 4, 'text-anchor': 'end' }, fmtZahl(t)));
    }
    const beschriftungsSchritt = Math.max(1, Math.ceil(kategorien.length / Math.max(2, Math.floor((breite - links) / 44))));
    kategorien.forEach((k, i) => {
      const cx = links + band * (i + 0.5);
      let y = hoehe - unten;
      const aktiveReihen = reihen.filter((r) => sichtbar.has(r.id) && (r.werte.get(k.schluessel) || 0) > 0);
      aktiveReihen.forEach((r, j) => {
        const wert = r.werte.get(k.schluessel);
        const hPix = sy(0) - sy(wert);
        const oberstes = j === aktiveReihen.length - 1;
        const lueckeOben = oberstes ? 0 : 2;
        const rh = Math.max(1, hPix - lueckeOben);
        y -= hPix;
        const rechteck = oberstes
          ? s('path', { d: abgerundetOben(cx - bw / 2, y, bw, rh, Math.min(4, rh)), fill: r.farbe, class: 'zelle' + (animieren ? ' saeule-wachsen' : '') })
          : s('rect', { x: cx - bw / 2, y: y + lueckeOben, width: bw, height: rh, fill: r.farbe, class: 'zelle' + (animieren ? ' saeule-wachsen' : '') });
        if (animieren) rechteck.style.animationDelay = (i * 25) + 'ms';
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(k.titel || k.text), ttZeile(r.farbe, mehrzahl(wert, 'Partie', 'Partien'), r.name, '', true)], el);
        rechteck.addEventListener('pointermove', zeige);
        rechteck.addEventListener('pointerdown', zeige);
        rechteck.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
        svg.appendChild(rechteck);
      });
      if (i % beschriftungsSchritt === 0) svg.appendChild(s('text', { x: cx, y: hoehe - 6, 'text-anchor': 'middle' }, k.text));
    });
    svg.appendChild(s('line', { class: 'achse', x1: links, x2: breite - rechts, y1: hoehe - unten + 0.5, y2: hoehe - unten + 0.5 }));
    el.appendChild(svg);
  });
  wrap.appendChild(behaelter);
  return wrap;
}

function abgerundetOben(x, y, b, hh, r) {
  if (hh <= 0) return '';
  r = Math.min(r, b / 2, hh);
  return 'M' + x + ' ' + (y + hh) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + b - r) + 'Q' + (x + b) + ' ' + y + ' ' + (x + b) + ' ' + (y + r) + 'V' + (y + hh) + 'Z';
}

// ---------------------------------------------------------------------------
// Matrix (Farbfeld), z. B. Stärken-Matrix oder Paarungen
// ---------------------------------------------------------------------------

/**
 * zeilen/spalten: [{ key, kopf: Node, name }]
 * zelle(zeile, spalte) -> { farbe, text, tooltip: () => Nodes, leer } | null
 */
function matrixDiagramm(zeilen, spalten, zelle, optionen = {}) {
  const box = h('div', { class: 'matrix-rahmen' });
  const raster = h('div', { class: 'matrix', style: { gridTemplateColumns: 'minmax(32px, auto) repeat(' + spalten.length + ', minmax(' + (optionen.zellBreite || 46) + 'px, 1fr))' } });
  raster.appendChild(h('div', { class: 'matrix-ecke' }, optionen.ecke || ''));
  for (const sp of spalten) raster.appendChild(h('div', { class: 'matrix-kopf', title: sp.name }, sp.kopf));
  const animieren = !bewegungReduziert();
  zeilen.forEach((z, i) => {
    raster.appendChild(h('div', { class: 'matrix-zeilenkopf' }, z.kopf));
    spalten.forEach((sp, j) => {
      const c = zelle(z, sp);
      if (!c) { raster.appendChild(h('div', { class: 'matrix-zelle leer' })); return; }
      const el = h('div', {
        class: 'matrix-zelle zelle' + (c.blass ? ' blass' : '') + (animieren ? ' zelle-an' : ''), tabindex: '0',
        style: { background: c.farbe, color: textFarbeAuf(c.farbe), animationDelay: ((i + j) * 30) + 'ms' }
      }, c.text || '');
      if (c.tooltip) {
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, c.tooltip(), el);
        el.addEventListener('pointermove', zeige);
        el.addEventListener('pointerdown', zeige);
        el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); zeigeTooltip(r.left + r.width / 2, r.top, c.tooltip(), el); });
        el.addEventListener('blur', versteckeTooltip);
        el.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
      }
      if (c.aktion) el.addEventListener('click', c.aktion);
      raster.appendChild(el);
    });
  });
  box.appendChild(raster);
  return beobachteRollen(box);
}

// ---------------------------------------------------------------------------
// Aktivitätskalender (Wochen × Wochentage)
// ---------------------------------------------------------------------------

function kalenderDiagramm(werte, von, bis) {
  return diagrammBehaelter((el, breite) => {
    const links = 24, oben = 18;
    const startMontag = von - wochentagVon(von);
    let wochen = Math.floor((bis - startMontag) / 7) + 1;
    let zelle = Math.floor((breite - links) / wochen) - 2;
    let erste = startMontag;
    let hinweis = null;
    if (zelle < 9) {
      zelle = 9;
      const passen = Math.floor((breite - links) / (zelle + 2));
      erste = startMontag + (wochen - passen) * 7;
      wochen = passen;
      hinweis = 'Letzte ' + passen + ' Wochen';
    }
    zelle = Math.min(zelle, 18);
    const schritt = zelle + 2;
    const hoehe = oben + 7 * schritt + 4;
    const max = Math.max(1, ...[...werte.values()]);
    const svg = s('svg', { width: Math.min(breite, links + wochen * schritt + 2), height: hoehe, role: 'img', 'aria-label': 'Aktivitätskalender' });
    ['Mo', 'Mi', 'Fr', 'So'].forEach((t) => {
      const zeileNr = WOCHENTAGE_KURZ.indexOf(t);
      svg.appendChild(s('text', { x: 0, y: oben + zeileNr * schritt + zelle - 2 }, t));
    });
    let letzterMonat = null;
    for (let w = 0; w < wochen; w++) {
      const wochenStart = erste + w * 7;
      const m = monatVon(wochenStart + 6);
      if (m !== letzterMonat) {
        if (w < wochen - 1) svg.appendChild(s('text', { x: links + w * schritt, y: 11 }, MONATE_KURZ[m - 1]));
        letzterMonat = m;
      }
      for (let d = 0; d < 7; d++) {
        const tag = wochenStart + d;
        if (tag < von || tag > bis) continue;
        const anzahl = werte.get(tag) || 0;
        const r = s('rect', { class: 'zelle', x: links + w * schritt, y: oben + d * schritt, width: zelle, height: zelle, rx: 3, fill: anzahl ? sequentiell(anzahl / max) : SEQ_LEER });
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(fmtDatumLang(tag)), ttZeile(null, anzahl ? mehrzahl(anzahl, 'Partie', 'Partien') : 'Kein Spieleabend', '')], el);
        r.addEventListener('pointermove', zeige);
        r.addEventListener('pointerdown', zeige);
        r.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
        svg.appendChild(r);
      }
    }
    el.appendChild(svg);
    const skala = h('div', { class: 'skala' }, h('span', {}, 'weniger'),
      h('span', { class: 'skala-band', style: { background: 'linear-gradient(90deg, ' + SEQ_STUFEN.join(', ') + ')' } }), h('span', {}, 'mehr Partien'),
      hinweis ? h('span', { style: { marginLeft: 'auto' } }, hinweis) : null);
    el.appendChild(skala);
  });
}

// ---------------------------------------------------------------------------
// Punkte-Verteilung (Box- und Streifendiagramm je Spieler)
// ---------------------------------------------------------------------------

/** zeilen: [{ person, werte: [{ wert, titel }] }] */
function verteilungsDiagramm(zeilen, optionen = {}) {
  return diagrammBehaelter((el, breite, animieren) => {
    const alle = zeilen.flatMap((z) => z.werte.map((w) => w.wert));
    if (!alle.length) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Keine Punkte im gewählten Zeitraum.')); return; }
    const zeilenHoehe = 40;
    const links = 58, rechts = 14, oben = 6, unten = 24;
    const hoehe = oben + zeilen.length * zeilenHoehe + unten;
    const ticks = schoeneTicks(Math.min(...alle), Math.max(...alle), Math.max(3, Math.floor((breite - links) / 70)));
    const sx = skalaLinear(ticks[0], ticks[ticks.length - 1], links, breite - rechts);
    const svg = s('svg', { width: breite, height: hoehe, role: 'img', 'aria-label': 'Punkte-Verteilung' });
    for (const t of ticks) {
      svg.appendChild(s('line', { class: 'gitter', x1: sx(t), x2: sx(t), y1: oben, y2: hoehe - unten }));
      svg.appendChild(s('text', { x: sx(t), y: hoehe - 6, 'text-anchor': 'middle' }, fmtZahl(t)));
    }
    const rnd = mulberry32(7);
    zeilen.forEach((z, i) => {
      const cy = oben + i * zeilenHoehe + zeilenHoehe / 2;
      const farbe = z.person.farbe;
      svg.appendChild(s('text', { class: 'beschriftung', x: 0, y: cy + 4 }, z.person.kuerzel));
      const sortiert = z.werte.map((w) => w.wert).sort((a, b) => a - b);
      if (sortiert.length >= 3) {
        const q1 = quantil(sortiert, 0.25), q3 = quantil(sortiert, 0.75), med = quantil(sortiert, 0.5);
        svg.appendChild(s('line', { x1: sx(sortiert[0]), x2: sx(sortiert[sortiert.length - 1]), y1: cy, y2: cy, stroke: farbe, 'stroke-width': 1.5, opacity: 0.7 }));
        svg.appendChild(s('rect', { x: sx(q1), y: cy - 10, width: Math.max(2, sx(q3) - sx(q1)), height: 20, rx: 5, fill: mitAlpha(farbe, 0.22), stroke: farbe, 'stroke-width': 1.5 }));
        svg.appendChild(s('line', { x1: sx(med), x2: sx(med), y1: cy - 10, y2: cy + 10, stroke: '#ffffff', 'stroke-width': 2 }));
      }
      z.werte.forEach((w, j) => {
        const jitter = (rnd() - 0.5) * 12;
        const c = s('circle', { cx: sx(w.wert), cy: cy + jitter, r: 3.5, fill: farbe, stroke: 'var(--flaeche)', 'stroke-width': 1.5, class: animieren ? 'punkt-einblenden' : '' });
        if (animieren) c.style.animationDelay = (j * 12) + 'ms';
        svg.appendChild(c);
        const t = s('circle', { class: 'treffer', cx: sx(w.wert), cy: cy + jitter, r: 10 });
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(w.titel || ''), ttZeile(farbe, fmtKurz(w.wert, 1) + ' Punkte', z.person.kuerzel, w.zusatz || '')], el);
        t.addEventListener('pointermove', zeige);
        t.addEventListener('pointerdown', zeige);
        t.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
        svg.appendChild(t);
      });
    });
    el.appendChild(svg);
    el.appendChild(h('p', { class: 'skala' }, 'Kasten: mittlere Hälfte der Ergebnisse, weißer Strich: Median, Linie: niedrigster bis höchster Wert.'));
  });
}

// ---------------------------------------------------------------------------
// Punkte-Verlauf (Streudiagramm mit Trendlinie je Spieler)
// ---------------------------------------------------------------------------

function punkteVerlaufDiagramm(reihen, optionen = {}) {
  const sichtbar = new Set(reihen.map((r) => r.id));
  const wrap = h('div', { class: 'stapel eng' });
  let behaelter;
  if (reihen.length > 1) wrap.appendChild(legendeMitSchaltern(reihen, sichtbar, () => behaelter.neuZeichnen()));
  behaelter = diagrammBehaelter((el, breite, animieren) => {
    const aktive = reihen.filter((r) => sichtbar.has(r.id));
    const alle = aktive.flatMap((r) => r.punkte);
    if (!alle.length) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Keine Punkte im gewählten Zeitraum.')); return; }
    const hoehe = optionen.hoehe || 230;
    const ys = alle.map((p) => p.y), xs = alle.map((p) => p.x);
    const ticksY = schoeneTicks(Math.min(...ys), Math.max(...ys), 5);
    const links = Math.max(34, textBreite(fmtZahl(ticksY[ticksY.length - 1])) + 10), rechts = 12, oben = 8, unten = 24;
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const sx = skalaLinear(xMin, xMax === xMin ? xMin + 1 : xMax, links + 6, breite - rechts - 6);
    const sy = skalaLinear(ticksY[0], ticksY[ticksY.length - 1], hoehe - unten, oben);
    const svg = s('svg', { width: breite, height: hoehe, role: 'img', 'aria-label': 'Punkte-Verlauf' });
    for (const t of ticksY) {
      svg.appendChild(s('line', { class: 'gitter', x1: links, x2: breite - rechts, y1: sy(t), y2: sy(t) }));
      svg.appendChild(s('text', { x: links - 8, y: sy(t) + 4, 'text-anchor': 'end' }, fmtZahl(t)));
    }
    for (const t of datumsTicks(xMin, xMax, Math.max(2, Math.floor((breite - links) / 70)))) {
      if (t.wert >= xMin && t.wert <= xMax) svg.appendChild(s('text', { x: sx(t.wert), y: hoehe - 6, 'text-anchor': 'middle' }, t.text));
    }
    const alleTreffer = [];
    for (const r of aktive) {
      const g = s('g', {});
      for (const p of r.punkte) {
        g.appendChild(s('circle', { cx: sx(p.x), cy: sy(p.y), r: 4, fill: mitAlpha(r.farbe, 0.8), stroke: 'var(--flaeche)', 'stroke-width': 1.5, class: animieren ? 'punkt-einblenden' : '' }));
        alleTreffer.push({ r, p, x: sx(p.x), y: sy(p.y) });
      }
      if (r.punkte.length >= 3) {
        const reg = regression(r.punkte.map((p) => p.x), r.punkte.map((p) => p.y));
        if (reg) {
          const x0 = Math.min(...r.punkte.map((p) => p.x)), x1 = Math.max(...r.punkte.map((p) => p.x));
          g.appendChild(s('line', { x1: sx(x0), x2: sx(x1), y1: sy(reg.achse + reg.steigung * x0), y2: sy(reg.achse + reg.steigung * x1), stroke: r.farbe, 'stroke-width': 2, 'stroke-linecap': 'round' }));
        }
      }
      svg.appendChild(g);
    }
    // Nächster Punkt zum Zeiger (große Trefferfläche)
    const flaeche = s('rect', { class: 'treffer', x: links, y: 0, width: breite - links, height: hoehe - unten });
    const markierung = s('circle', { r: 7, fill: 'none', stroke: '#fff', 'stroke-width': 1.5, visibility: 'hidden' });
    svg.appendChild(markierung);
    const zeige = (ev) => {
      const box = svg.getBoundingClientRect();
      const px = ev.clientX - box.left, py = ev.clientY - box.top;
      let bester = null, abstand = Infinity;
      for (const t of alleTreffer) { const d = (t.x - px) ** 2 + (t.y - py) ** 2; if (d < abstand) { abstand = d; bester = t; } }
      if (!bester || abstand > 40 * 40) { versteckeTooltip(); markierung.setAttribute('visibility', 'hidden'); return; }
      markierung.setAttribute('cx', bester.x); markierung.setAttribute('cy', bester.y); markierung.setAttribute('visibility', 'visible');
      zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(fmtDatum(bester.p.x)), ttZeile(bester.r.farbe, fmtKurz(bester.p.y, 1) + ' Punkte', bester.r.name, bester.p.zusatz || '')], el);
    };
    flaeche.addEventListener('pointermove', zeige);
    flaeche.addEventListener('pointerdown', zeige);
    flaeche.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') { versteckeTooltip(); markierung.setAttribute('visibility', 'hidden'); } });
    svg.appendChild(flaeche);
    el.appendChild(svg);
  });
  wrap.appendChild(behaelter);
  return wrap;
}

// ---------------------------------------------------------------------------
// Netzdiagramm (Vergleich von bis zu 4 Spielern)
// ---------------------------------------------------------------------------

/** achsen: [{ name }], reihen: [{ id, name, farbe, werte: [0..1 | null], texte: [] }] */
function netzDiagramm(achsen, reihen) {
  const wrap = h('div', { class: 'stapel eng' });
  if (reihen.length > 1) wrap.appendChild(h('div', { class: 'legende' }, reihen.map((r) => h('span', { class: 'legende-eintrag' }, h('span', { class: 'schluessel-linie', style: { '--farbe': r.farbe } }), r.name))));
  wrap.appendChild(diagrammBehaelter((el, breite, animieren) => {
    if (achsen.length < 3) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Für das Netzdiagramm braucht es mindestens drei Spiele mit Partien.')); return; }
    const groesse = Math.min(breite, 380);
    const r = groesse / 2 - 54;
    const cx = breite / 2, cy = groesse / 2;
    const svg = s('svg', { width: breite, height: groesse, role: 'img', 'aria-label': 'Netzdiagramm' });
    const winkel = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / achsen.length;
    for (const stufe of [0.25, 0.5, 0.75, 1]) {
      const pts = achsen.map((_, i) => (cx + Math.cos(winkel(i)) * r * stufe).toFixed(1) + ',' + (cy + Math.sin(winkel(i)) * r * stufe).toFixed(1)).join(' ');
      svg.appendChild(s('polygon', { points: pts, fill: 'none', class: 'gitter' }));
    }
    achsen.forEach((a, i) => {
      const x = cx + Math.cos(winkel(i)) * r, y = cy + Math.sin(winkel(i)) * r;
      svg.appendChild(s('line', { class: 'gitter', x1: cx, y1: cy, x2: x, y2: y }));
      const lx = cx + Math.cos(winkel(i)) * (r + 16), ly = cy + Math.sin(winkel(i)) * (r + 16);
      const anker = Math.abs(Math.cos(winkel(i))) < 0.2 ? 'middle' : Math.cos(winkel(i)) > 0 ? 'start' : 'end';
      svg.appendChild(s('text', { class: 'beschriftung', x: lx, y: ly + 4, 'text-anchor': anker }, a.name.length > 16 ? a.name.slice(0, 15) + '…' : a.name));
    });
    for (const reihe of reihen) {
      const pts = reihe.werte.map((v, i) => {
        const w = v === null ? 0 : v;
        return [cx + Math.cos(winkel(i)) * r * w, cy + Math.sin(winkel(i)) * r * w];
      });
      const poly = s('polygon', { points: pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), fill: mitAlpha(reihe.farbe, 0.1), stroke: reihe.farbe, 'stroke-width': 2, 'stroke-linejoin': 'round' });
      if (animieren) { poly.style.transformOrigin = cx + 'px ' + cy + 'px'; poly.animate([{ transform: 'scale(0.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 700, easing: 'cubic-bezier(.2,.9,.2,1)' }); }
      svg.appendChild(poly);
      pts.forEach((p, i) => {
        svg.appendChild(s('circle', { cx: p[0], cy: p[1], r: 4, fill: reihe.farbe, stroke: 'var(--flaeche)', 'stroke-width': 2 }));
        const t = s('circle', { class: 'treffer', cx: p[0], cy: p[1], r: 12 });
        const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(achsen[i].name), ttZeile(reihe.farbe, reihe.texte[i], reihe.name)], el);
        t.addEventListener('pointermove', zeige);
        t.addEventListener('pointerdown', zeige);
        t.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
        svg.appendChild(t);
      });
    }
    el.appendChild(svg);
  }));
  return wrap;
}

// ---------------------------------------------------------------------------
// Mitspieler-Netz (wer spielt wie oft mit wem)
// ---------------------------------------------------------------------------

function mitspielerNetz(personen, kanten) {
  return diagrammBehaelter((el, breite, animieren) => {
    if (personen.length < 2 || !kanten.length) { el.appendChild(h('p', { class: 'text-3 klein' }, 'Noch keine gemeinsamen Partien im gewählten Zeitraum.')); return; }
    const groesse = Math.min(breite, 420);
    const cx = breite / 2, cy = groesse / 2;
    const r = groesse / 2 - 34;
    const pos = new Map(personen.map((p, i) => {
      const w = -Math.PI / 2 + (i * 2 * Math.PI) / personen.length;
      return [p.key, { x: cx + Math.cos(w) * r, y: cy + Math.sin(w) * r, p }];
    }));
    const maxG = Math.max(...kanten.map((k) => k.gewicht));
    const svg = s('svg', { width: breite, height: groesse, role: 'img', 'aria-label': 'Mitspieler-Netz' });
    const kantenGruppe = s('g', {});
    const kantenEl = [];
    for (const k of kanten) {
      const a = pos.get(k.a.key), b = pos.get(k.b.key);
      if (!a || !b) continue;
      const anteil = k.gewicht / maxG;
      const linie = s('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#c9a45a', 'stroke-width': (1 + anteil * 9).toFixed(1), 'stroke-linecap': 'round', opacity: (0.18 + anteil * 0.6).toFixed(2), class: 'zelle' });
      linie.dataset.a = k.a.key; linie.dataset.b = k.b.key;
      const zeige = (ev) => zeigeTooltip(ev.clientX, ev.clientY, [ttTitel(k.a.kuerzel + ' und ' + k.b.kuerzel), ttZeile(null, mehrzahl(k.gewicht, 'gemeinsame Partie', 'gemeinsame Partien'), '')], el);
      linie.addEventListener('pointermove', zeige);
      linie.addEventListener('pointerdown', zeige);
      linie.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') versteckeTooltip(); });
      kantenGruppe.appendChild(linie);
      kantenEl.push(linie);
    }
    svg.appendChild(kantenGruppe);
    let gewaehlt = null;
    for (const { x, y, p } of pos.values()) {
      // Inaktive Spieler wie ihre Abzeichen entsättigt darstellen
      const g = s('g', { tabindex: '0', role: 'button', 'aria-label': p.kuerzel + (p.aktiv ? '' : ' (inaktiv)'), style: { cursor: 'pointer', filter: p.aktiv ? '' : 'grayscale(0.7) brightness(0.8)' } });
      g.appendChild(s('circle', { cx: x, cy: y, r: 19, fill: p.farbe, stroke: 'var(--flaeche)', 'stroke-width': 3 }));
      g.appendChild(s('text', { x, y: y + 4, 'text-anchor': 'middle', style: { fill: p.textFarbe, fontWeight: 750, fontSize: '11px' } }, p.kuerzel.slice(0, 4)));
      const waehle = (ev) => {
        gewaehlt = gewaehlt === p.key ? null : p.key;
        for (const l of kantenEl) l.classList.toggle('gedimmt', !!gewaehlt && l.dataset.a !== gewaehlt && l.dataset.b !== gewaehlt);
        if (gewaehlt) {
          const eigene = kanten.filter((k) => k.a.key === p.key || k.b.key === p.key).sort((m, n) => n.gewicht - m.gewicht);
          zeigeTooltip(ev.clientX || x, ev.clientY || y, [ttTitel(p.kuerzel + ' spielte mit'), eigene.map((k) => {
            const o = k.a.key === p.key ? k.b : k.a;
            return ttZeile(o.farbe, fmtZahl(k.gewicht), o.kuerzel, 'Partien');
          })], el);
        } else versteckeTooltip();
      };
      g.addEventListener('click', waehle);
      g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); const r2 = g.getBoundingClientRect(); waehle({ clientX: r2.left + r2.width / 2, clientY: r2.top }); } });
      svg.appendChild(g);
    }
    if (animieren) kantenGruppe.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: 'ease-out' });

    el.appendChild(h('p', { class: 'skala' }, 'Dickere Linien: mehr gemeinsame Partien. Spieler antippen, um die Verbindungen hervorzuheben.'));
  });

function sparkline(werte, farbe, breite = 64, hoehe = 22) {
  const svg = s('svg', { width: breite, height: hoehe, viewBox: '0 0 ' + breite + ' ' + hoehe, class: 'funke', 'aria-hidden': 'true' });
  if (werte.length < 2) return svg;
  const min = Math.min(...werte), max = Math.max(...werte);
  const sx = skalaLinear(0, werte.length - 1, 2, breite - 4);
  const sy = skalaLinear(min, max === min ? min + 1 : max, hoehe - 3, 3);
  svg.appendChild(s('path', { d: werte.map((v, i) => (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(v).toFixed(1)).join(''), fill: 'none', stroke: mitAlpha(farbe, 0.85), 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  svg.appendChild(s('circle', { cx: sx(werte.length - 1), cy: sy(werte[werte.length - 1]), r: 2.6, fill: farbe }));
  return svg;
}

/** spalten: [{ titel, links }], zeilen: [[zelle, ...]] */
function datenTabelle(spalten, zeilen) {
  const tabelle = h('table', { class: 'daten' },
    h('thead', {}, h('tr', {}, spalten.map((sp) => h('th', { class: sp.links ? 'links' : '', scope: 'col' }, sp.titel)))),
    h('tbody', {}, zeilen.map((z) => h('tr', { class: z.gedimmt ? 'gedimmt' : '' }, (z.zellen || z).map((c, i) => h('td', { class: spalten[i] && spalten[i].links ? 'links' : '' }, c))))));
  return beobachteRollen(h('div', { class: 'tabellen-rahmen' }, tabelle));
}

/**
 * Markiert einen seitlich scrollbaren Rahmen: Klasse „rollt“, wenn der Inhalt breiter ist,
 * und „am-ende“, wenn ganz nach rechts gescrollt wurde. Die CSS blendet dann rechts aus
 * und hinterlegt die feste erste Spalte.
 */
function beobachteRollen(rahmen) {
  const pruefe = () => {
    const rollt = rahmen.scrollWidth > rahmen.clientWidth + 2;
    rahmen.classList.toggle('rollt', rollt);
    rahmen.classList.toggle('am-ende', !rollt || rahmen.scrollLeft + rahmen.clientWidth >= rahmen.scrollWidth - 2);
  };
  rahmen.addEventListener('scroll', pruefe, { passive: true });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(pruefe).observe(rahmen);
  requestAnimationFrame(pruefe);
  return rahmen;
}
